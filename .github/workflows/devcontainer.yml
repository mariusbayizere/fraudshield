# Builds the Codespaces devcontainer on a GitHub runner, which runs .devcontainer/post-create.sh
# (pinned toolchains, locked dependencies, `REQUIRE_DOCKER=1 make ci` including the Docker
# stack), then re-checks the stack from inside the container (ADR 0010).
#
# Heavy, so it runs only when its inputs changed, and always on pushes to main, nightly, and on
# manual dispatch (owner direction, 2026-09-17).
name: devcontainer

on:
  push:
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devcontainer-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVCONTAINER_INPUTS: '^(\.devcontainer/.*|\.tool-versions|\.python-version|\.nvmrc|Makefile|docker-compose[^/]*\.ya?ml|.*Dockerfile[^/]*|infrastructure/docker/.*|uv\.lock|frontend/pnpm-lock\.yaml|backend/(.*/)?pom\.xml|backend/\.mvn/.*|\.github/workflows/devcontainer\.yml)$'

jobs:
  changes:
    name: detect devcontainer input changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          decide() { echo "run=$1" >> "$GITHUB_OUTPUT"; echo "run=$1 ($2)"; }
          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            decide true "$EVENT_NAME"; exit 0
          fi
          if [ "$EVENT_NAME" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
            decide true "push to main"; exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"
          elif printf '%s' "$BEFORE" | grep -qE '^0+$' || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base=$(git merge-base origin/main "$HEAD_SHA" 2>/dev/null || true)
            if [ -z "$base" ]; then decide true "new branch without a base on main"; exit 0; fi
          else
            base="$BEFORE"
          fi
          matches=$(git diff --name-only "$base" "$HEAD_SHA" | grep -E "$DEVCONTAINER_INPUTS" || true)
          if [ -n "$matches" ]; then
            decide true "inputs changed: $(printf '%s' "$matches" | tr '\n' ' ')"
          else
            decide false "no devcontainer inputs changed since $base"
          fi

  build-and-verify:
    name: build devcontainer, post-create make ci, smoke test inside
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          runCmd: |
            set -euo pipefail
            test -f .devcontainer/.post-create-ok || { echo "post-create did not complete" >&2; exit 1; }
            java -version 2>&1 | head -1
            uv --version
            node --version
            pnpm --version
            make smoke
      # Output inside the container is not parsed for annotations; the post-create log is written
      # to the mounted workspace, so report its tail from the runner (readable without log access).
      - name: Report post-create log on failure
        if: failure()
        run: |
          log=.devcontainer/post-create.log
          if [ ! -f "$log" ]; then
            echo "::error title=post-create::no post-create.log (failed before the script started)"
            exit 0
          fi
          tail -n 60 "$log"
          python3 - "$log" <<'PY'
          import sys
          lines = open(sys.argv[1], errors="replace").read().splitlines()[-40:]
          message = "\n".join(lines)[-3500:]
          escaped = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=post-create log tail::{escaped}")
          PY
