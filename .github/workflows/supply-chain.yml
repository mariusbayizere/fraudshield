# Supply chain (SRS 8.1 stage 6, build prompt D-28, M9 gate): CycloneDX SBOMs and cosign
# signatures, and the service images with their size limits and Trivy image scan.
#
# Signing is keyless (Sigstore): the signature is bound to this workflow's GitHub OIDC identity and
# recorded in the public Rekor log, so no signing key exists to leak. Every signature is verified
# in the same job against the expected workflow identity. Pull requests only build and scan;
# signing and pushing happen on pushes to this repository's branches.
#
# Images: `image-matrix` lists every service image and keeps those whose Dockerfile exists. Only
# those get an `images` job; a missing Dockerfile is a warning and a "NOT BUILT" line in the
# summary. No job reports success for an image that was never built.
name: supply-chain

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

env:
  CERTIFICATE_IDENTITY: ^https://github\.com/mariusbayizere/fraudshield/\.github/workflows/supply-chain\.yml@refs/heads/
  CERTIFICATE_ISSUER: https://token.actions.githubusercontent.com

jobs:
  source-sbom:
    name: source SBOM (CycloneDX) + cosign signature
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: SBOM of every dependency the repository declares
        run: |
          infrastructure/bin/syft scan dir:. --source-name fraudshield --source-version "$GITHUB_SHA" \
            --output cyclonedx-json=fraudshield-source.cdx.json
          jq -e '.bomFormat == "CycloneDX" and (.components | length) > 0' fraudshield-source.cdx.json
          echo "components: $(jq '.components | length' fraudshield-source.cdx.json)" >>"$GITHUB_STEP_SUMMARY"
      - name: Sign and verify the SBOM
        if: github.event_name != 'pull_request'
        run: |
          infrastructure/bin/cosign sign-blob --yes --bundle fraudshield-source.cdx.json.sigstore.json \
            fraudshield-source.cdx.json
          infrastructure/bin/cosign verify-blob --bundle fraudshield-source.cdx.json.sigstore.json \
            --certificate-identity-regexp "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$CERTIFICATE_ISSUER" fraudshield-source.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-source
          path: fraudshield-source.cdx.json*
          retention-days: 90

  image-matrix:
    name: which service images can be built?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      any: ${{ steps.select.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: select
        # Size limits from SRS 8.1 stage 6; edge and worker limits are FraudShield's own.
        run: |
          all='[
            {"image": "fraudshield-api", "dockerfile": "backend/Dockerfile", "context": "backend", "max_mb": 500},
            {"image": "fraudshield-ml", "dockerfile": "ml/Dockerfile", "context": ".", "max_mb": 1200},
            {"image": "fraudshield-ml-worker", "dockerfile": "ml/Dockerfile.worker", "context": ".", "max_mb": 1200},
            {"image": "fraudshield-frontend", "dockerfile": "frontend/Dockerfile", "context": "frontend", "max_mb": 150},
            {"image": "fraudshield-edge", "dockerfile": "infrastructure/docker/edge/Dockerfile", "context": "infrastructure/docker/edge", "max_mb": 100}
          ]'
          present='[]'
          while read -r row; do
            file=$(jq -r .dockerfile <<<"$row")
            if [ -f "$file" ]; then
              present=$(jq -c --argjson r "$row" '. + [$r]' <<<"$present")
            else
              name=$(jq -r .image <<<"$row")
              echo "::warning title=$name not built::$file does not exist yet"
              echo "NOT BUILT: $name ($file does not exist yet)" >>"$GITHUB_STEP_SUMMARY"
            fi
          done < <(jq -c '.[]' <<<"$all")
          echo "matrix={\"include\":$present}" >>"$GITHUB_OUTPUT"
          echo "any=$(jq 'length > 0' <<<"$present")" >>"$GITHUB_OUTPUT"

  images:
    name: image ${{ matrix.image }} (build, size, scan, SBOM, sign)
    needs: image-matrix
    if: needs.image-matrix.outputs.any == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # keyless signing
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.image-matrix.outputs.matrix) }}
    env:
      IMAGE: ghcr.io/mariusbayizere/${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          CONTEXT: ${{ matrix.context }}
        run: docker build --file "$DOCKERFILE" --tag "$IMAGE:$GITHUB_SHA" "$CONTEXT"
      - name: Size limit
        env:
          MAX_MB: ${{ matrix.max_mb }}
        run: |
          bytes=$(docker image inspect --format '{{.Size}}' "$IMAGE:$GITHUB_SHA")
          mb=$((bytes / 1000000))
          echo "${{ matrix.image }}: ${mb} MB (limit ${MAX_MB} MB)" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$mb" -lt "$MAX_MB"
      - name: Trivy image scan (HIGH/CRITICAL with a fix)
        run: |
          infrastructure/bin/trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "$IMAGE:$GITHUB_SHA"
      - name: Image SBOM (CycloneDX)
        run: |
          infrastructure/bin/syft scan "docker:$IMAGE:$GITHUB_SHA" \
            --output "cyclonedx-json=${{ matrix.image }}.cdx.json"
      - name: Push, sign and attest the SBOM by digest
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA")
          infrastructure/bin/cosign sign --yes "$digest"
          infrastructure/bin/cosign attest --yes --type cyclonedx \
            --predicate "${{ matrix.image }}.cdx.json" "$digest"
          infrastructure/bin/cosign verify --certificate-identity-regexp "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$CERTIFICATE_ISSUER" "$digest" >/dev/null
          echo "${{ matrix.image }}: $digest signed and SBOM attested" >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.image }}
          path: ${{ matrix.image }}.cdx.json
          retention-days: 90
