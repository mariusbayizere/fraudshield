# The paper's evidence gates (M11). Every number in docs/research/paper is a macro audited against
# its evidence file at a named git reference; these jobs make that a gate rather than something run
# when remembered (owner, 2026-10-19). Not path-filtered on purpose: an evidence file changed
# anywhere in the repository can falsify a number in the paper, and a filtered job reports success
# when it is skipped.
name: paper

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: paper-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.15"
  PYTHON_VERSION: "3.12.14"
  RUFF_VERSION: "0.16.8"
  TECTONIC_VERSION: "0.17.0"
  # tectonic-0.17.0-x86_64-unknown-linux-musl.tar.gz, digest from the GitHub release.
  TECTONIC_SHA256: "8533d07f9ccbd7a65824b9e0459041bca34af1eb33daba48f59215593753a3b7"
  # The TeX bundle is pinned by URL and by the SHA-256 digest Tectonic records for it, and cached,
  # so an ordinary build reads no outside service (owner, 2026-10-19). The digest is the one in
  # the bundle's hashes file after a fetch; a bundle that changed under the same URL fails the job.
  TECTONIC_BUNDLE: "https://relay.fullyjustified.net/default_bundle_v33.tar"
  TECTONIC_BUNDLE_DIGEST: "6ffe055852f8faf66c0acbe1a7fb27f87b869a90bad1204f3bf4d9683f597c7c"

jobs:
  checks:
    name: numbers audited, appendices generated, figures current
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The audit reads evidence with `git show <ref>:<path>` at tags and commits.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Lint the paper's scripts
        run: |
          uvx "ruff@${RUFF_VERSION}" check docs/research/paper
          uvx "ruff@${RUFF_VERSION}" format --check docs/research/paper
      - name: No number typed into the paper
        run: python3 docs/research/paper/check_numbers.py
      - name: Every macro matches its evidence, and the audit outputs are current
        run: python3 docs/research/paper/audit_numbers.py --check
      - name: Appendix B matches the feature registry
        run: python3 docs/research/paper/appendix_features.py --check
      - name: Figures match numbers.tex
        run: python3 docs/research/paper/figures/make_figures.py --check

  compile:
    name: the paper compiles with no undefined references or overfull lines
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Tectonic (checksum-verified release binary)
        run: |
          url="https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40${TECTONIC_VERSION}/tectonic-${TECTONIC_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/tectonic.tar.gz" "$url"
          echo "${TECTONIC_SHA256}  $RUNNER_TEMP/tectonic.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/tectonic.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/tectonic" --version
      - name: Locate the Tectonic cache
        id: tectonic-cache
        run: |
          # `show user-cache-dir` prints .../tectonic/bundles; cache its parent, which also holds the
          # compiled format, so a cached build neither fetches nor rebuilds it.
          bundles=$("$RUNNER_TEMP/tectonic" -X show user-cache-dir)
          test -n "$bundles"
          echo "dir=$(dirname "$bundles")" >> "$GITHUB_OUTPUT"
      - name: Restore the cached TeX bundle files
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.tectonic-cache.outputs.dir }}
          # The files a build needs follow from the paper's sources, so they are part of the key;
          # an older entry for the same bundle is restored as a start and topped up.
          key: tectonic-${{ env.TECTONIC_VERSION }}-${{ env.TECTONIC_BUNDLE_DIGEST }}-${{ hashFiles('docs/research/paper/**/*.tex', 'docs/research/paper/*.bib') }}
          restore-keys: |
            tectonic-${{ env.TECTONIC_VERSION }}-${{ env.TECTONIC_BUNDLE_DIGEST }}-
      - name: Compile
        id: compile
        working-directory: docs/research/paper
        run: |
          # Offline first, from the cache only. Fetch from the pinned bundle only for files the cache
          # lacks (a cache miss, or a package the paper newly uses), and then verify the bundle.
          if "$RUNNER_TEMP/tectonic" -X compile --keep-logs --only-cached --bundle "$TECTONIC_BUNDLE" main.tex; then
            echo "fetched=false" >> "$GITHUB_OUTPUT"
          else
            echo "offline compile failed (files missing from the cache, or a LaTeX error); retrying online from the pinned bundle"
            "$RUNNER_TEMP/tectonic" -X compile --keep-logs --bundle "$TECTONIC_BUNDLE" main.tex
            echo "fetched=true" >> "$GITHUB_OUTPUT"
          fi

          # grep on a missing file exits 2, which `if` reads as no match: require the log first.
          test -s main.log

          if grep -E "undefined (references|citations)|Citation .* undefined|Reference .* undefined" main.log; then
            echo "undefined references or citations" >&2
            exit 1
          fi
          if grep -E "Overfull \\\\hbox" main.log; then
            echo "overfull lines (README: the build has none)" >&2
            exit 1
          fi
          # An offline build treats a file missing from a partial cache as absent. Where LaTeX then
          # substitutes rather than stops, it warns in the log; fail on the warning. (A "LaTeX Font
          # Info" substitution, such as bold typewriter set as bold, is the font's design and
          # happens online too, so it is not matched.)
          # A missing file that only changes an \IfFileExists branch leaves no trace and is a known,
          # accepted gap: the paper uses no such optional input.
          if grep -E "LaTeX Font Warning|not found in (the )?bundle" main.log; then
            echo "a TeX resource was missing or substituted" >&2
            exit 1
          fi
      - name: The bundle is the pinned one
        env:
          CACHE_DIR: ${{ steps.tectonic-cache.outputs.dir }}
        run: |
          found=$(cat "$CACHE_DIR"/bundles/hashes/*default_bundle_v33.tar)  # fails if absent
          if [ "$found" != "$TECTONIC_BUNDLE_DIGEST" ]; then
            echo "bundle digest $found, pinned $TECTONIC_BUNDLE_DIGEST" >&2
            exit 1
          fi
          echo "bundle digest $found matches the pin"
      - name: Save the TeX bundle files for later builds
        if: steps.restore.outputs.cache-hit != 'true' && steps.compile.outputs.fetched == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.tectonic-cache.outputs.dir }}
          key: ${{ steps.restore.outputs.cache-primary-key }}
      - name: Upload the PDF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paper-pdf
          path: docs/research/paper/main.pdf
