[project]
name = "fraudshield-tools"
version = "0.1.0"
description = "Governance tooling: defect register, traceability matrix, scope guard"
requires-python = "==3.12.*"
license = "Apache-2.0"
dependencies = ["PyYAML==6.0.3"]

[project.scripts]
fs-traceability = "fraudshield_tools.traceability:main"
fs-traceability-seed = "fraudshield_tools.traceability_seed:main"
fs-defect-register = "fraudshield_tools.defect_register:main"
fs-scope-guard = "fraudshield_tools.scope_guard:main"
fs-commit-msg = "fraudshield_tools.commit_msg:main"
fs-evidence = "fraudshield_tools.evidence_run:main"
fs-licences = "fraudshield_tools.licences:main"
fs-compose-budget = "fraudshield_tools.compose_budget:main"
fs-seed-demo = "fraudshield_tools.seed_demo:main"
fs-migration-guard = "fraudshield_tools.migration_guard:main"
fs-readme-status = "fraudshield_tools.readme_status:main"
fs-exit-criteria = "fraudshield_tools.exit_criteria:main"

[project.entry-points.pytest11]
fraudshield-requires-docker = "fraudshield_tools.pytest_docker"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraudshield_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["req(*ids): links a test to requirement or defect IDs in docs/traceability/requirements.yaml"]
addopts = "-rs --strict-markers --import-mode=importlib --cov=fraudshield_tools --cov-branch --cov-report=term-missing:skip-covered --cov-fail-under=90"
