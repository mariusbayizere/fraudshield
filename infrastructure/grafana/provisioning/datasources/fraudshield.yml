# Grafana datasources for one FraudShield namespace (SRS 08: FraudShield's own Grafana). The uids
# are fixed because every provisioned dashboard refers to its datasource by uid.
apiVersion: 1
prune: true
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://fraudshield-prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 30s
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://fraudshield-loki:3100
    editable: false
