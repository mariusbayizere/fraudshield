# Dashboards are provisioned from files generated by infrastructure/grafana/generate_dashboards.py.
# They are read-only in the UI: a change is a reviewed commit, never an edit in Grafana.
apiVersion: 1
providers:
  - name: fraudshield
    folder: FraudShield
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
