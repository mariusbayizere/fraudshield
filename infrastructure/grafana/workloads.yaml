# Grafana with provisioned, read-only dashboards. Staff reach it only through the API's
# authenticated proxy (E.8: never anonymous embeds); anonymous access, sign-up, update checks and
# usage reporting are off, so the instance never calls out of the cluster. The admin password
# comes from the Secret fraudshield-grafana-admin (key: password), created per environment.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fraudshield-grafana
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraudshield-grafana
  labels: {app.kubernetes.io/name: fraudshield-grafana, app.kubernetes.io/component: monitoring}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: fraudshield-grafana}
  template:
    metadata:
      labels: {app.kubernetes.io/name: fraudshield-grafana, app.kubernetes.io/component: monitoring}
    spec:
      serviceAccountName: fraudshield-grafana
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: grafana
          image: grafana/grafana:13.2.1@sha256:f772d434e8fab0049deb2b1b30abd43342bcfca1537614aa8d36080232cf4283
          ports:
            - {name: http, containerPort: 3000}
          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "false"}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
            - {name: GF_SECURITY_ADMIN_PASSWORD__FILE, value: /etc/grafana/secrets/password}
            - {name: GF_SECURITY_COOKIE_SECURE, value: "true"}
            - {name: GF_SECURITY_DISABLE_GRAVATAR, value: "true"}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES, value: "false"}
            - {name: GF_NEWS_NEWS_FEED_ENABLED, value: "false"}
            - {name: GF_PLUGINS_PREINSTALL_DISABLED, value: "true"}
            - {name: GF_PATHS_PROVISIONING, value: /etc/grafana/provisioning}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources}
            - {name: dashboard-providers, mountPath: /etc/grafana/provisioning/dashboards}
            - {name: dashboards, mountPath: /etc/grafana/dashboards}
            - {name: admin, mountPath: /etc/grafana/secrets, readOnly: true}
            - {name: data, mountPath: /var/lib/grafana}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: datasources
          configMap: {name: fraudshield-grafana-datasources}
        - name: dashboard-providers
          configMap: {name: fraudshield-grafana-dashboard-providers}
        - name: dashboards
          configMap: {name: fraudshield-grafana-dashboards}
        - name: admin
          secret: {secretName: fraudshield-grafana-admin}
        # Provisioned dashboards and datasources are rebuilt from files on start, so Grafana's
        # own database holds nothing that must survive a restart.
        - name: data
          emptyDir: {sizeLimit: 1Gi}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: fraudshield-grafana
  labels: {app.kubernetes.io/name: fraudshield-grafana}
spec:
  selector: {app.kubernetes.io/name: fraudshield-grafana}
  ports:
    - {name: http, port: 3000, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fraudshield-grafana
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: fraudshield-grafana}
