# edge (C.1): Nginx with TLS 1.3, HSTS, CSP, rate limiting and request size limits, in front of
# the API and the front end. The only workload reachable from outside the cluster. The TLS
# certificate comes from the Secret fraudshield-edge-tls (kubernetes.io/tls), provisioned per
# environment. Deployment interface: infrastructure/k8s/README.md.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fraudshield-edge
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraudshield-edge
  labels: {app.kubernetes.io/name: fraudshield-edge, app.kubernetes.io/component: edge}
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: {app.kubernetes.io/name: fraudshield-edge}
  template:
    metadata:
      labels: {app.kubernetes.io/name: fraudshield-edge, app.kubernetes.io/component: edge}
    spec:
      serviceAccountName: fraudshield-edge
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector: {matchLabels: {app.kubernetes.io/name: fraudshield-edge}}
      containers:
        - name: edge
          image: ghcr.io/mariusbayizere/fraudshield-edge
          ports:
            - {name: https, containerPort: 8443}
          resources:
            requests: {cpu: 250m, memory: 128Mi}
            limits: {memory: 256Mi}
          livenessProbe:
            httpGet: {path: /healthz, port: https, scheme: HTTPS}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /healthz, port: https, scheme: HTTPS}
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tls, mountPath: /etc/fraudshield/tls, readOnly: true}
            - {name: cache, mountPath: /var/cache/nginx}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tls
          secret: {secretName: fraudshield-edge-tls}
        - name: cache
          emptyDir: {sizeLimit: 256Mi}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: fraudshield-edge
  labels: {app.kubernetes.io/name: fraudshield-edge}
spec:
  type: LoadBalancer
  # Keep the client source address so the edge's per-IP rate limits (D-26) see real clients.
  externalTrafficPolicy: Local
  selector: {app.kubernetes.io/name: fraudshield-edge}
  ports:
    - {name: https, port: 443, targetPort: https}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fraudshield-edge
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: fraudshield-edge}
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 60}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fraudshield-edge
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: fraudshield-edge}
