# fraudshield-api (C.1): ingestion, auth, decision engine, holds and timers, staff APIs, webhooks.
# Deployment interface (what the image must provide): infrastructure/k8s/README.md.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fraudshield-api
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraudshield-api
  labels: {app.kubernetes.io/name: fraudshield-api, app.kubernetes.io/component: api}
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels: {app.kubernetes.io/name: fraudshield-api}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app.kubernetes.io/name: fraudshield-api, app.kubernetes.io/component: api}
    spec:
      serviceAccountName: fraudshield-api
      automountServiceAccountToken: false
      # Graceful shutdown tries to drain this pod's spool to Kafka; whatever remains is recovered
      # from the shared volume by another API pod (ADR 0090).
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app.kubernetes.io/name: fraudshield-api}}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector: {matchLabels: {app.kubernetes.io/name: fraudshield-api}}
      containers:
        - name: api
          image: ghcr.io/mariusbayizere/fraudshield-api
          ports:
            - {name: http, containerPort: 8080}
            - {name: management, containerPort: 8081}
          envFrom:
            - configMapRef: {name: fraudshield-api-config}
            - secretRef: {name: fraudshield-api-secrets}
          env:
            # ADR 0090: every pod writes <FRAUDSHIELD_SPOOL_DIR>/<FRAUDSHIELD_SPOOL_INSTANCE>/ on the
            # shared volume and replays directories of pods that no longer exist.
            - {name: FRAUDSHIELD_SPOOL_DIR, value: /var/lib/fraudshield/spool}
            - name: FRAUDSHIELD_SPOOL_INSTANCE
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          resources:
            requests: {cpu: "1", memory: 1Gi}
            limits: {memory: 2Gi}
          startupProbe:
            httpGet: {path: /actuator/health, port: management}
            periodSeconds: 5
            failureThreshold: 36
          # Liveness: process only (ADR 0014 section 6), so a scorer or Kafka outage never restarts
          # healthy API pods. Readiness: the public health endpoint, UP only while this instance
          # can accept and decide requests.
          livenessProbe:
            httpGet: {path: /actuator/health, port: management}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /api/v1/health, port: http}
            periodSeconds: 5
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: spool, mountPath: /var/lib/fraudshield/spool}
            - {name: tmp, mountPath: /tmp}
      volumes:
        # Never emptyDir or any storage deleted with the pod (ADR 0090); k8s_policy.py enforces it.
        - name: spool
          persistentVolumeClaim: {claimName: fraudshield-api-spool}
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
---
# Shared spool volume (ADR 0090). The StorageClass must provide ReadWriteMany with known fsync
# latency; overlays set it. Size: a bound on decisions awaiting Kafka across all API pods.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fraudshield-api-spool
  labels: {app.kubernetes.io/name: fraudshield-api}
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests: {storage: 20Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: fraudshield-api
  labels: {app.kubernetes.io/name: fraudshield-api}
spec:
  selector: {app.kubernetes.io/name: fraudshield-api}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
# Management port: detailed health and metrics, cluster-internal only (ADR 0014 section 6). The
# edge never routes to it and a NetworkPolicy admits only Prometheus and the blackbox exporter.
apiVersion: v1
kind: Service
metadata:
  name: fraudshield-api-management
  labels: {app.kubernetes.io/name: fraudshield-api}
spec:
  selector: {app.kubernetes.io/name: fraudshield-api}
  ports:
    - {name: management, port: 8081, targetPort: management}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fraudshield-api
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: fraudshield-api}
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 60}
  behavior:
    # Scale up fast for traffic bursts; scale down slowly so spools drain and caches stay warm.
    scaleUp:
      stabilizationWindowSeconds: 0
      policies: [{type: Percent, value: 100, periodSeconds: 30}]
    scaleDown:
      stabilizationWindowSeconds: 600
      policies: [{type: Pods, value: 1, periodSeconds: 120}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fraudshield-api
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: fraudshield-api}
