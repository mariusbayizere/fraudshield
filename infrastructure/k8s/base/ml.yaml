# fraudshield-ml (C.1, D-16): gRPC scoring over mTLS, FastAPI admin and health, one model copy per
# process. Deployment interface: infrastructure/k8s/README.md.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fraudshield-ml
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraudshield-ml
  labels: {app.kubernetes.io/name: fraudshield-ml, app.kubernetes.io/component: scorer}
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels: {app.kubernetes.io/name: fraudshield-ml}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app.kubernetes.io/name: fraudshield-ml, app.kubernetes.io/component: scorer}
    spec:
      serviceAccountName: fraudshield-ml
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector: {matchLabels: {app.kubernetes.io/name: fraudshield-ml}}
      containers:
        - name: scorer
          image: ghcr.io/mariusbayizere/fraudshield-ml
          ports:
            - {name: grpc, containerPort: 50051}
            - {name: admin, containerPort: 8000}
          envFrom:
            - secretRef: {name: fraudshield-ml-secrets}
          resources:
            requests: {cpu: "2", memory: 3Gi}
            limits: {memory: 4Gi}
          # The gRPC port is mTLS-only and kubelet gRPC probes cannot present a client
          # certificate, so probes use the admin HTTP port (C.1: FastAPI admin/health).
          # Startup allows for loading the models once per process (D-16).
          startupProbe:
            httpGet: {path: /health/live, port: admin}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /health/live, port: admin}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /health/ready, port: admin}
            periodSeconds: 5
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: fraudshield-ml
  labels: {app.kubernetes.io/name: fraudshield-ml}
spec:
  selector: {app.kubernetes.io/name: fraudshield-ml}
  ports:
    - {name: grpc, port: 50051, targetPort: grpc, appProtocol: grpc}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fraudshield-ml
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: fraudshield-ml}
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 60}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies: [{type: Percent, value: 100, periodSeconds: 30}]
    scaleDown:
      stabilizationWindowSeconds: 600
      policies: [{type: Pods, value: 1, periodSeconds: 120}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fraudshield-ml
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: fraudshield-ml}
