# fraudshield-frontend (C.1): the staff console PWA as static files behind the edge.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fraudshield-frontend
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraudshield-frontend
  labels: {app.kubernetes.io/name: fraudshield-frontend, app.kubernetes.io/component: frontend}
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: {app.kubernetes.io/name: fraudshield-frontend}
  template:
    metadata:
      labels: {app.kubernetes.io/name: fraudshield-frontend, app.kubernetes.io/component: frontend}
    spec:
      serviceAccountName: fraudshield-frontend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: frontend
          image: ghcr.io/mariusbayizere/fraudshield-frontend
          ports:
            - {name: http, containerPort: 8080}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: fraudshield-frontend
  labels: {app.kubernetes.io/name: fraudshield-frontend}
spec:
  selector: {app.kubernetes.io/name: fraudshield-frontend}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fraudshield-frontend
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: fraudshield-frontend}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fraudshield-frontend
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: fraudshield-frontend}
