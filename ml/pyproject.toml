[project]
name = "fraudshield-ml"
version = "0.1.0"
description = "FraudShield ML pipeline and scoring service: features, ensemble, calibration, SHAP, evaluation"
requires-python = "==3.12.*"
license = "Apache-2.0"
dependencies = [
    "h3==4.5.0",
    # Reads the dataset's published Parquet. The feature pipeline consumes the interchange format
    # rather than importing fraudshield-dataset: a pipeline that imported the producer could read
    # values the published format does not carry, and would work here and fail on a release.
    "pyarrow==25.0.1",
    "xgboost==3.0.2",
    # The SRS specifies the production model as 0.55*XGBoost + 0.45*LightGBM (E.4), so this is
    # the second half of a model that was already designed rather than a dependency taken on for
    # one measurement. C-6 claims the ensemble reduces seed variance by 12% and cannot be
    # settled without it.
    "lightgbm==4.7.0",
    # M5 serving. IsolationForest (D-06) and IsotonicRegression (D-05) come from scikit-learn.
    "scikit-learn==1.9.1",
    # The scoring contract is gRPC (contracts/proto); the health service is the standard one the
    # proto's header names for orchestration probes. Pinned to the grpcio-tools that compiles it.
    "grpcio==1.84.0",
    "grpcio-health-checking==1.84.0",
    # FR-02-09 feature store and FR-02-06 threshold store. Redis server stays on 7.2 (ADR 0003);
    # the client is protocol-compatible with it.
    "redis==8.1.0",
    "prometheus-client==0.26.0",
    # Serving inference for both boosters (ADR 0032): exact to 1e-6 against the native boosters
    # on XGBoost and LightGBM alike, without the per-call overhead of their Python wrappers and
    # with no compiler at build time. SHAP stays on the native boosters.
    "treelite==4.7.2",
    # The admin port (health, model status, shadow switch); never on the hot path.
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
]

[dependency-groups]
dev = [
    # In-process Redis for unit tests on a machine without Docker; the real-Redis tests run in CI.
    "fakeredis==2.35.1",
    # E.4's ONNX export parity test (ADR 0032). Test-only: serving uses Treelite, because the
    # LightGBM converter accepts float32 input only and cannot meet the 1e-5 parity.
    "onnx==1.23.0",
    "onnxmltools==1.16.0",
    "onnxruntime==1.30.0",
]

[project.scripts]
fs-features = "fraudshield_ml.cli:main"
fs-model = "fraudshield_ml.models.cli:main"
fs-scorer = "fraudshield_ml.serving.cli:main"
fs-bench = "fraudshield_ml.serving.benchmark:main"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraudshield_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["req(*ids): links a test to requirement or defect IDs in docs/traceability/requirements.yaml"]
addopts = "-rs --strict-markers --import-mode=importlib --cov=fraudshield_ml --cov-branch --cov-report=term-missing:skip-covered --cov-fail-under=90"

[tool.coverage.run]
# protoc's output, checked for freshness by test rather than exercised line by line.
omit = ["*/serving/generated/scoring_pb2.py"]
