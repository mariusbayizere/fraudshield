# from tags in code (JUnit @Tag, pytest.mark.req, "[ID]" title prefix) by fs-traceability.
requirements:
- id: FR-01-01
  section: 3.1 FR-01 Transaction ingestion API
  title: POST /api/v1/transactions/ingest accepts transaction payload; validates schema; publishes to
    Kafka within 5ms
  priority: M
  milestone: M6
  srs_text: 'Acceptance criterion: Locust load test: 10,000 req/sec for 60 seconds; all within 5ms Kafka
    publish latency; zero data loss confirmed by consumer offset check'
  defects:
  - D-13
  status: NOT_STARTED
  verification: test
  implementation: []
  evidence: []
  deviations: []
  notes: 'Benchmark row (ADR 0010): gate numbers only from a dedicated machine recorded in docs/benchmarks/hardware.md,
    never from shared CI runners; until then at most VERIFIED_AT_REDUCED_SCALE with ''machine: <id>''.'
- id: FR-01-02
  section: 3.1 FR-01 Transaction ingestion API
  title: 'Transaction schema: transaction_id (UUID), account_id (tokenised), counterparty_id (tokenised),
    amount (DECIMAL 18,4), currency (ISO 4217 3-char), channel ENUM(MOBILE_MONEY/CARD/AGENT_BANKING/USSD/ONLINE/BANK_TRANSFER),
    merchant_category_code (4-char), latitude, longitude, device_fingerprint (nullable), transaction_timestamp
    (ISO 8601 UTC)'
  priority: M
  milestone: M6
  srs_text: 'Acceptance criterion: 400 returned for any missing required field with specific field-level
    error; 422 for type mismatches'
  defects: []
  status: NOT_STARTED
  verification: test
  implementation: []
  evidence: []
  deviations: []
- id: FR-01-03
  section: 3.1 FR-01 Transaction ingestion API
  title: 'Idempotent ingestion: duplicate transaction_id within 24 hours returns 200 with cached ScoringResult;
    not reprocessed'
  priority: M
  milestone: M6
  srs_text: 'Acceptance criterion: Integration test: same transaction_id submitted 100 times; exactly
    1 scored; all 100 return identical cached response; Redis idempotency key TTL=24h confirmed'
  defects:
  - D-12
  status: NOT_STARTED
  verification: test
  implementation: []
  evidence: []
  deviations: []
