description: Size, span and growth of the simulated transaction stream.
parameters:
  total_rows_target:
    value: 5200000
    unit: transactions
    provenance: CALIBRATED_TO_SRS_TARGET
    citation: SRS v1.0 section 7.1, ML-DATA-01 (at least 5,000,000; 4.16M train / 520K validation / 520K test)
    rationale: The three split sizes named in ML-DATA-01 sum to 5.2M, so the generator targets 5.2M rather than the 5M floor.
  simulation_months:
    value: 24
    unit: months
    provenance: CALIBRATED_TO_SRS_TARGET
    citation: SRS v1.0 section 7.1, ML-DATA-06 (24 months simulation)
  start_month:
    value: "2024-01"
    unit: calendar month (YYYY-MM)
    provenance: ASSUMED
    rationale: Calendar anchor for weekdays, month ends and school-fee terms; any recent 24-month window serves, and the data is synthetic.
  monthly_growth_rate:
    value: 0.0199
    unit: month-on-month growth in transaction volume
    provenance: SOURCED
    citation: >-
      Bank of Tanzania, Payment Systems Annual Report for 2024 (2025), Annex H, Table H1 "Mobile
      Payments", page 47: mobile money transaction volume of 6,414 million in 2024 against 5,061.20
      million in 2023, a rise of 26.73%, which is 1.99% per month compounded.
      https://www.bot.go.tz/Publications/Regular/Annual%20Report/sw/2025032515311662.pdf
    accessed: 2026-09-18
    rationale: >-
      Computed from the two volumes in the table rather than from the report's rounded 27% headline,
      which would give 2.01% (the earlier value, corrected in the M2 principal review). The figure is
      Tanzanian: Rwanda publishes no comparable volume series, and its active subscriber count grew
      only 1.8% in the year to June 2025 while its transaction volume grew far faster (NBR Annual
      Report 2024-2025, page 86), so this rate is a proxy for the region's growth rather than a
      measurement of Rwanda's. Growth is applied as a smooth monthly ramp, and the dataset's total
      row count is calibrated to ML-DATA-01, so the rate sets the shape of the ramp and not the size
      of the dataset.
