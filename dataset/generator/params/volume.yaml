description: Size, span and growth of the simulated transaction stream.
parameters:
  total_rows_target:
    value: 5200000
    unit: transactions
    provenance: CALIBRATED_TO_SRS_TARGET
    citation: SRS v1.0 section 7.1, ML-DATA-01 (at least 5,000,000; 4.16M train / 520K validation / 520K test)
    rationale: The three split sizes named in ML-DATA-01 sum to 5.2M, so the generator targets 5.2M rather than the 5M floor.
  simulation_months:
    value: 24
    unit: months
    provenance: CALIBRATED_TO_SRS_TARGET
    citation: SRS v1.0 section 7.1, ML-DATA-06 (24 months simulation)
  start_month:
    value: "2024-01"
    unit: calendar month (YYYY-MM)
    provenance: ASSUMED
    rationale: Calendar anchor for weekdays, month ends and school-fee terms; any recent 24-month window serves, and the data is synthetic.
  monthly_growth_rate:
    value: 0.0201
    unit: month-on-month growth in transaction volume
    provenance: SOURCED
    citation: >-
      Bank of Tanzania, Payment Systems Annual Report for 2024 (2025), Annex H, Table H1 "Mobile Payments",
      page 47: mobile money transaction volume grew 27% in 2024 (6,414 million from 5,061.20 million), which
      is 2.01% per month compounded.
      https://www.bot.go.tz/Publications/Regular/Annual%20Report/sw/2025032515311662.pdf
    accessed: 2026-09-18
    rationale: >-
      Growth is applied as a smooth monthly ramp rather than the uneven year-on-year path the reports show
      (Tanzania recorded 41% in 2023 and 27% in 2024; Rwanda's active subscriber count grew only 1.8% in the
      year to June 2025 while its transaction volume grew much faster, NBR Annual Report 2024-2025, page 86).
      The dataset's total row count is calibrated to ML-DATA-01, so this rate sets the shape of the ramp
      rather than the size of the dataset.
