[project]
name = "fraudshield-workspace"
version = "0.0.0"
description = "uv workspace root for FraudShield Python components (not a distributable package)"
requires-python = "==3.12.*"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["tools", "ml", "contracts"]

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.8",
    "types-PyYAML==6.0.12.20260906",
    "types-jsonschema==4.26.0.20260518",
    "pre-commit==4.6.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "DTZ", "PT", "RET", "SIM", "PL", "RUF"]
ignore = ["PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["fraudshield_tools", "fraudshield_ml", "fraudshield_contracts"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "PLR0913"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

# grpcio-tools ships no type information; it is used only to compile protobuf contracts in tests.
[[tool.mypy.overrides]]
module = ["grpc_tools", "grpc_tools.*"]
ignore_missing_imports = true
