openapi: 3.1.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: FraudShield API
  version: 1.0.0-m1
  summary: Real-time fraud decisions for East African digital payments, and the staff console API.
  description: |
    Contract-first specification (ADR 0011). Conventions:

    * Money is a decimal string plus an ISO 4217 currency; never a JSON number.
    * Account, counterparty, device and agent identifiers are opaque tokens (`tok_…`); raw phone or
      account numbers are rejected.
    * Errors are RFC 9457 problem details with `type` URNs and a `correlation_id`.
    * Machine clients authenticate with `X-API-Key`; staff with an RS256 bearer JWT.
    * Every operation declares `x-required-scopes` (API keys), `x-required-roles` (staff),
      `x-refresh-cookie: true` (token refresh) or `x-public: true`.

    SYNTHETIC DATA ONLY in development and demo environments (D-21).
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /api/v1
    description: Relative to the deployment's base URL
tags:
  - name: ingestion
    description: Machine-to-machine transaction ingestion and decisions (FR-01, FR-03)
  - name: health
  - name: auth
    description: Staff authentication and account lifecycle (FR-07)
  - name: alerts
    description: Analyst alert feed, investigation and decisions (FR-04)
  - name: accounts
    description: Account history, behavioural fingerprint and network (FR-04-06..08)
  - name: risk-officer
    description: Portfolio, model performance, campaigns, rules, thresholds, SAR, overrides (FR-05)
  - name: admin
    description: Users, API keys, models, datasets, health, audit (FR-06)
  - name: verification
    description: Server-rendered customer verification page (FR-03-04/05, D-25, D-42)

security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------------------------------------
  # Ingestion (API key)
  # ---------------------------------------------------------------------------------------------
  /transactions/ingest:
    post:
      tags: [ingestion]
      operationId: ingestTransaction
      summary: Score a transaction and return the decision synchronously
      description: |
        Validates, scores and decides within the synchronous latency budget (D-13). MEDIUM decisions
        return `HOLD`; the final decision follows via `GET /decisions/{transaction_id}` and the
        `decision.final` webhook (D-14).

        **Idempotency (FR-01-03).** The idempotency record stores, with the cached
        `DecisionResponse`, a SHA-256 fingerprint of the canonical request (the validated fields
        serialised in schema order, amounts as normalised decimal strings). Within 24 hours:
        * same `transaction_id`, same fingerprint → 200 with the cached decision and
          `Idempotent-Replayed: true`, no rescoring;
        * same `transaction_id`, different fingerprint → 409 `idempotency-conflict`; nothing is
          scored or cached, and an AUTH audit event with action `IDEMPOTENCY_CONFLICT` is written;
        * a duplicate that arrives while the first request is still being decided waits for that
          result (up to the latency budget) and then follows the two rules above; if the first
          request fails, the duplicate is processed as a first submission.

        **Validation (ADR 0011 section 6).** 400 when the body is not a usable instance of the
        schema (malformed JSON, missing required field, unknown field, raw identifier instead of a
        token); otherwise 422 for type mismatches and unacceptable values. Every error is listed in
        `errors[]` with a `ValidationErrorCode`; with errors of both classes the status is 400.
        Vectors: contracts/validation/request-validation-vectors.json.
      security:
        - apiKeyAuth: []
      x-required-scopes: ["ingest:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransactionIngestRequest" }
            examples:
              mobileMoney: { $ref: "#/components/examples/IngestMobileMoney" }
              ussd: { $ref: "#/components/examples/IngestUssd" }
              agentBanking: { $ref: "#/components/examples/IngestAgentBanking" }
              card: { $ref: "#/components/examples/IngestCard" }
              online: { $ref: "#/components/examples/IngestOnline" }
              bankTransfer: { $ref: "#/components/examples/IngestBankTransfer" }
      responses:
        "200":
          description: Decision (first submission or idempotent replay)
          headers:
            Idempotent-Replayed:
              description: Present with value `true` when the response is a cached replay
              schema: { type: string, enum: ["true"] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DecisionResponse" }
              examples:
                declined: { $ref: "#/components/examples/DecisionDeclined" }
                hold: { $ref: "#/components/examples/DecisionHold" }
                approved: { $ref: "#/components/examples/DecisionApproved" }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  /transactions/ingest/batch:
    post:
      tags: [ingestion]
      operationId: ingestTransactionBatch
      summary: Submit up to 1,000 transactions for asynchronous scoring (FR-01-06)
      description: >-
        Items follow the single-ingest idempotency rules; an item whose transaction_id conflicts
        with an earlier submission is reported in the job results as REJECTED with an
        idempotency-conflict problem, and the other items are still processed.
      security:
        - apiKeyAuth: []
      x-required-scopes: ["ingest:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransactionBatchRequest" }
      responses:
        "202":
          description: Accepted; poll the job
          headers:
            Location:
              description: URL of the job resource
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAccepted" }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  /jobs/{job_id}:
    get:
      tags: [ingestion]
      operationId: getJob
      summary: Batch job progress and per-item results
      security:
        - apiKeyAuth: []
      x-required-scopes: ["jobs:read"]
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  /decisions/{transaction_id}:
    get:
      tags: [ingestion]
      operationId: getFinalDecision
      summary: Current or final decision for a transaction (D-14)
      security:
        - apiKeyAuth: []
      x-required-scopes: ["decisions:read"]
      parameters:
        - $ref: "#/components/parameters/TransactionId"
      responses:
        "200":
          description: Decision state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinalDecision" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  # ---------------------------------------------------------------------------------------------
  # Health. Component detail is for administrators only (ADR 0014): a public endpoint showing
  # that the ML scorer has fallen back to rules would tell attackers when to strike.
  # ---------------------------------------------------------------------------------------------
  /actuator/health:
    servers:
      - url: "{scheme}://{instance}:{managementPort}"
        description: Management port of each API instance, reachable only from the cluster network
        variables:
          scheme: { default: http, enum: [http, https] }
          instance: { default: localhost }
          managementPort: { default: "8081" }
    get:
      tags: [health]
      operationId: getLiveness
      summary: Process liveness and readiness for orchestration probes
      description: >-
        Reports only whether this API instance can accept and decide requests. The rule-based
        fallback keeps the API able to decide, so ML or Kafka degradation does not change this
        status and is not disclosed here.
      security: []
      x-public: true
      x-network: management
      responses:
        "200":
          description: Up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProbeStatus" }
        "503":
          description: Down
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProbeStatus" }

  /actuator/health/ml:
    servers:
      - url: "{scheme}://{instance}:{managementPort}"
        description: Management port of each API instance, reachable only from the cluster network
        variables:
          scheme: { default: http, enum: [http, https] }
          instance: { default: localhost }
          managementPort: { default: "8081" }
    get:
      tags: [health]
      operationId: getMlComponentHealth
      summary: ML scorer health for the monitoring probe and the deployment smoke test
      description: >-
        The SRS blackbox probe and staging smoke test read ML health without a staff token. They
        use this management-port endpoint, which is never routed through the public ingress, so
        the fallback state is not visible to attackers (ADR 0014).
      security: []
      x-public: true
      x-network: management
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComponentHealth" }
        "503":
          description: Unhealthy or degraded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComponentHealth" }

  /actuator/health/kafka:
    servers:
      - url: "{scheme}://{instance}:{managementPort}"
        description: Management port of each API instance, reachable only from the cluster network
        variables:
          scheme: { default: http, enum: [http, https] }
          instance: { default: localhost }
          managementPort: { default: "8081" }
    get:
      tags: [health]
      operationId: getKafkaComponentHealth
      summary: Kafka producer and spool health for the deployment smoke test
      description: >-
        Replaces the SRS staging gate's unauthenticated /api/v1/health/kafka check. Management port
        only, never routed through the public ingress (ADR 0014).
      security: []
      x-public: true
      x-network: management
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComponentHealth" }
        "503":
          description: Broker unreachable; decisions continue and events spool to disk (D-15)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComponentHealth" }

  /health/ml:
    get:
      tags: [health]
      operationId: getMlHealth
      summary: ML scoring service health, including whether the rule-based fallback is active
      x-required-roles: [ADMIN]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComponentHealth" }
        "503":
          description: Unhealthy or degraded (rule-based fallback active)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComponentHealth" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /health/kafka:
    get:
      tags: [health]
      operationId: getKafkaHealth
      summary: Kafka producer and local spool health
      x-required-roles: [ADMIN]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComponentHealth" }
        "503":
          description: Broker unreachable; decisions continue, events spool to disk (D-15)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComponentHealth" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------------------------------------------------------------------------------------
  # Auth (FR-07)
  # ---------------------------------------------------------------------------------------------
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Email and password sign-in
      description: |
        Returns an access token in the body and sets a rotating refresh-token cookie
        (httpOnly, Secure, SameSite=Strict, path `/api/v1/auth/refresh`) plus a CSRF cookie (D-27).
        10 attempts per 15 minutes per IP (higher for allow-listed office IPs, D-26); 5 failures lock
        the account. A password longer than 72 UTF-8 bytes is answered as invalid credentials
        without calling bcrypt. Correct credentials for an account in `PENDING_APPROVAL` or
        `DEACTIVATED` return 403 `account-not-active` (a wrong password returns 401 whatever the
        account state, so the state is not revealed to someone without the password).
      security: []
      x-public: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in
          headers:
            Set-Cookie:
              description: Refresh-token and CSRF cookies
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccountNotActive" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        "423": { $ref: "#/components/responses/Locked" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  /auth/google:
    post:
      tags: [auth]
      operationId: loginWithGoogle
      summary: Google sign-in (authorization code with PKCE)
      description: |
        The ID token is verified server-side (JWKS signature, `aud`, `iss`, `exp`,
        `email_verified`). Existing active accounts link by verified email; an allow-listed domain
        creates an ANALYST account in `PENDING_APPROVAL` with no access (D-23).
      security: []
      x-public: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoogleSignInRequest" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "202":
          description: Account created and awaiting administrator approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PendingApproval" }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: Rotate the refresh token and issue a new access token
      description: Reuse of a rotated refresh token revokes the whole token family (D-27).
      security:
        - refreshCookie: []
      x-refresh-cookie: true
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: New access token; refresh cookie rotated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End this session; revokes Google tokens when present (FR-07-09)
      description: >-
        The refresh cookie is scoped to the refresh path and never reaches this endpoint, so the
        session is identified by the access token's `sid` claim: the server revokes the refresh
        token family stored under that session ID and clears the cookie with a `Set-Cookie` that
        uses the refresh path (D-27).
      x-required-roles: [ANALYST, SENIOR_ANALYST, RISK_OFFICER, ADMIN]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204": { description: Signed out }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  /auth/logout-all:
    post:
      tags: [auth]
      operationId: logoutEverywhere
      summary: Invalidate every session by incrementing the token version (D-27)
      x-required-roles: [ANALYST, SENIOR_ANALYST, RISK_OFFICER, ADMIN]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204": { description: All sessions invalidated }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  /auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: Signed-in user's profile (name, avatar, role) for the header (FR-04-01)
      x-required-roles: [ANALYST, SENIOR_ANALYST, RISK_OFFICER, ADMIN]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Self-registration; always creates a PENDING_APPROVAL account (D-24)
      description: >-
        The response is the same 202 whether or not the email or employee ID is already
        registered, so this endpoint reveals nothing about existing accounts. For a duplicate no
        account is created and the existing account's owner is emailed a notice instead. The
        rate-limited availability check remains a deliberate, accepted enumeration channel (E.8,
        ADR 0014).
      security: []
      x-public: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistrationRequest" }
      responses:
        "202":
          description: >-
            Accepted; if the details were new, the account awaits email verification and
            administrator approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PendingApproval" }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  /auth/availability:
    get:
      tags: [auth]
      operationId: checkAvailability
      summary: Rate-limited availability check for email or employee ID during registration
      description: Responses take near-constant time to limit enumeration (E.8).
      security: []
      x-public: true
      parameters:
        - name: field
          in: query
          required: true
          schema: { type: string, enum: [email, employee_id] }
        - name: value
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 254 }
      responses:
        "200":
          description: Availability
          content:
            application/json:
              schema:
                type: object
                required: [available]
                additionalProperties: false
                properties:
                  available: { type: boolean }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  /auth/email-verification:
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: Confirm an email address with a single-use token
      security: []
      x-public: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SingleUseTokenRequest" }
      responses:
        "204": { description: Email verified }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "410": { $ref: "#/components/responses/Gone" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  /auth/password-reset/request:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: Email a 6-digit one-time code (FR-07-08); same response whether or not the email exists
      security: []
      x-public: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { $ref: "#/components/schemas/Email" }
      responses:
        "202": { description: "If the account exists, a code was sent" }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  /auth/password-reset/verify:
    post:
      tags: [auth]
      operationId: verifyPasswordResetCode
      summary: Exchange a valid one-time code for a short-lived reset token
      security: []
      x-public: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              additionalProperties: false
              properties:
                email: { $ref: "#/components/schemas/Email" }
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200":
          description: Code accepted
          content:
            application/json:
              schema:
                type: object
                required: [reset_token, expires_at]
                additionalProperties: false
                properties:
                  reset_token: { type: string, minLength: 32 }
                  expires_at: { $ref: "#/components/schemas/Timestamp" }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  /auth/password-reset/complete:
    post:
      tags: [auth]
      operationId: completePasswordReset
      summary: Set a new password with a reset token; invalidates all sessions (FR-07-09)
      security: []
      x-public: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reset_token, new_password]
              additionalProperties: false
              properties:
                reset_token: { type: string, minLength: 32 }
                new_password: { $ref: "#/components/schemas/Password" }
      responses:
        "204": { description: Password changed }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "410": { $ref: "#/components/responses/Gone" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  /auth/password:
    put:
      tags: [auth]
      operationId: changePassword
      summary: Change password while signed in; invalidates all sessions (FR-07-09)
      x-required-roles: [ANALYST, SENIOR_ANALYST, RISK_OFFICER, ADMIN]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              additionalProperties: false
              properties:
                current_password:
                  type: string
                  minLength: 1
                  maxLength: 1024
                  description: Over 72 UTF-8 bytes is answered 401 like a wrong password (ADR 0014)
                new_password: { $ref: "#/components/schemas/Password" }
      responses:
        "204": { description: Password changed }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  /auth/unlock:
    post:
      tags: [auth]
      operationId: unlockAccount
      summary: Unlock a locked account with the emailed single-use token (FR-07-06)
      security: []
      x-public: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SingleUseTokenRequest" }
