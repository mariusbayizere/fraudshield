  /auth/jwks.json:
    get:
      tags: [auth]
      operationId: getJwks
      summary: Public keys for access-token verification (key rotation by `kid`)
      security: []
      x-public: true
      responses:
        "200":
          description: JSON Web Key Set
          content:
            application/json:
              schema:
                type: object
                required: [keys]
