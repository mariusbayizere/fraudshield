  /thresholds:
    get:
      tags: [risk-officer]
      operationId: getThresholds
      summary: Current per-channel thresholds and MEDIUM timeout policies (FR-05-07, D-10)
      x-required-roles: [RISK_OFFICER, ADMIN]
      responses:
        "200":
          description: Thresholds
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThresholdSet" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  /thresholds/impact-preview:
    post:
      tags: [risk-officer]
      operationId: previewThresholdImpact
      summary: Estimated alerts per hour at proposed thresholds, from the last 24 h of scores
      x-required-roles: [RISK_OFFICER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelThreshold" }
      responses:
        "200":
          description: Estimate
          content:
            application/json:
              schema:
                type: object
                required: [channel, estimated_high_per_hour, estimated_medium_per_hour]
                additionalProperties: false
                properties:
                  channel: { $ref: "#/components/schemas/Channel" }
                  estimated_high_per_hour: { type: number, minimum: 0 }
                  estimated_medium_per_hour: { type: number, minimum: 0 }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  /sar-reports:
    get:
      tags: [risk-officer]
      operationId: listSarReports
      summary: Suspicious activity report drafts (FR-05-06, D-22)
      x-required-roles: [RISK_OFFICER]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [DRAFT, SIGNED_OFF] } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Reports
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SarReportPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  /sar-reports/{report_id}:
    get:
      tags: [risk-officer]
      operationId: getSarReport
      summary: "Report draft; PDF with `Accept: application/pdf` (watermarked DRAFT, never auto-submitted)"
      x-required-roles: [RISK_OFFICER]
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SarReport" }
            application/pdf:
              schema: { type: string, contentMediaType: application/pdf }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "406": { $ref: "#/components/responses/NotAcceptable" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  /sar-reports/{report_id}/sign-off:
    post:
      tags: [risk-officer]
      operationId: signOffSarReport
      summary: Record the risk officer's review and sign-off (REGULATORY_REPORT audit event)
      x-required-roles: [RISK_OFFICER]
      parameters:
        - $ref: "#/components/parameters/ReportId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, attestation]
              additionalProperties: false
              properties:
                version: { type: integer, minimum: 0 }
                attestation: { type: string, minLength: 20, maxLength: 2000 }
      responses:
        "200":
          description: Signed off
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SarReport" }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  # ---------------------------------------------------------------------------------------------
  # Admin (FR-06, FR-02-06)
  # ---------------------------------------------------------------------------------------------
  /admin/thresholds:
    patch:
      tags: [admin]
      operationId: updateThresholds
      summary: Change per-channel thresholds or timeout policy at runtime; effective within 60 s (FR-02-06)
      description: |
        Creates a new immutable threshold version; a THRESHOLD_CHANGE audit event is written. The
        path keeps the SRS name (FR-02-06), but only a risk officer may change thresholds: they
        decide which fraud is declined, and an administrator who also manages users, API keys and
        models must not control the decision surface alone (separation of duties, ADR 0014).
        Semantic checks (422): `medium_threshold` < `high_threshold` (`thresholds_not_ordered`) and
        at most one entry per channel (`duplicate_channel`).
      x-required-roles: [RISK_OFFICER]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ThresholdUpdate" }
      responses:
        "200":
          description: New threshold version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThresholdSet" }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  /admin/users:
    get:
      tags: [admin]
      operationId: listUsers
      summary: Staff accounts
      x-required-roles: [ADMIN]
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/UserStatus" } }
        - { name: role, in: query, schema: { $ref: "#/components/schemas/Role" } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffUserPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }
    post:
      tags: [admin]
      operationId: createUser
      summary: Create a staff account; sends a welcome email with a temporary password (FR-06-01)
      x-required-roles: [ADMIN]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffUserCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffUser" }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  /admin/users/{user_id}:
    get:
      tags: [admin]
      operationId: getUser
      summary: Staff account
      x-required-roles: [ADMIN]
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }
    patch:
      tags: [admin]
      operationId: updateUser
      summary: Update profile, role or status; role and status changes increment the token version (FR-06-02, D-27)
      description: >-
        Every account holds exactly one role (ADR 0014); an ADMIN is never also given a decision
        role, so ADMIN does not decide alerts (E.8).
      x-required-roles: [ADMIN]
      x-authorisation-rules:
        - rule: An administrator cannot change their own role or status (FR-07-01, no self-elevation)
          problem: urn:fraudshield:problem:self-modification
          status: 403
        - rule: The last ACTIVE ADMIN of an institution cannot be demoted, locked or deactivated
          problem: urn:fraudshield:problem:last-active-admin
          status: 409
        - rule: A stale version returns the current account
          problem: urn:fraudshield:problem:conflict
          status: 409
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffUserUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffUser" }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AuthorisationRuleViolation" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/StateConflict" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  /admin/approvals:
    get:
      tags: [admin]
      operationId: listPendingApprovals
      summary: Accounts awaiting approval (D-23, D-24)
      x-required-roles: [ADMIN]
      responses:
        "200":
          description: Pending accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StaffUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  /admin/approvals/{user_id}:
    post:
      tags: [admin]
      operationId: decideApproval
      summary: Approve with a granted role, or reject
      x-required-roles: [ADMIN]
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              additionalProperties: false
              properties:
                decision: { type: string, enum: [APPROVE, REJECT] }
                granted_role: { $ref: "#/components/schemas/Role" }
                reason: { type: string, maxLength: 500 }
              if:
                properties: { decision: { const: APPROVE } }
                required: [decision]
              then:
                required: [granted_role]
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffUser" }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  /admin/ip-allowlist:
    get:
      tags: [admin]
      operationId: listOfficeIpAllowlist
      summary: Office egress IP ranges with a higher login rate ceiling (D-26)
      x-required-roles: [ADMIN]
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IpAllowlistEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }
    post:
      tags: [admin]
      operationId: addOfficeIpRange
      summary: Add an office egress range
      x-required-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IpAllowlistEntryCreate" }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IpAllowlistEntry" }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  /admin/ip-allowlist/{entry_id}:
    delete:
      tags: [admin]
      operationId: removeOfficeIpRange
      summary: Remove an office egress range
      x-required-roles: [ADMIN]
      parameters:
        - name: entry_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  /admin/api-keys:
    get:
      tags: [admin]
      operationId: listApiKeys
      summary: API keys with name, scopes and last four characters only (FR-06-07)
      x-required-roles: [ADMIN]
      responses:
        "200":
          description: Keys
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApiKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }
    post:
      tags: [admin]
      operationId: createApiKey
      summary: Create a key; the raw secret is returned exactly once
      x-required-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApiKeyCreate" }
      responses:
        "201":
          description: Created
          headers:
            Cache-Control:
              description: Always `no-store`
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyCreated" }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  /admin/api-keys/{key_id}/rotate:
    post:
      tags: [admin]
      operationId: rotateApiKey
      summary: Issue a replacement; the old key stays valid for a 24-hour overlap
      x-required-roles: [ADMIN]
      parameters:
        - $ref: "#/components/parameters/KeyId"
      responses:
        "201":
          description: Replacement key (raw secret returned once)
          headers:
            Cache-Control:
              description: Always `no-store`
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyCreated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  /admin/api-keys/{key_id}/revoke:
    post:
      tags: [admin]
      operationId: revokeApiKey
      summary: Revoke; requests with the key return 401 within 5 seconds
      x-required-roles: [ADMIN]
      parameters:
        - $ref: "#/components/parameters/KeyId"
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  /admin/models:
    get:
      tags: [admin]
      operationId: listModelVersions
      summary: Model versions with metrics, aliases and promotion gate state (FR-06-03, D-11, D-50)
      x-required-roles: [ADMIN]
      responses:
        "200":
          description: Versions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ModelVersion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  /admin/models/{model_version}/promotion:
    post:
      tags: [admin]
      operationId: promoteModel
      summary: Promote to production; rejected with reasons unless the shadow gate passes (D-11)
      x-required-roles: [ADMIN]
      parameters:
        - $ref: "#/components/parameters/ModelVersionParam"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Promotion started; effective within 60 seconds
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelVersion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/PromotionGateFailed" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  /admin/models/rollback:
    post:
      tags: [admin]
      operationId: rollbackModel
      summary: Move @production back to @previous_production within 30 seconds
      x-required-roles: [ADMIN]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Rollback started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelVersion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  /admin/models/shadow:
    put:
      tags: [admin]
      operationId: setShadowModel
      summary: Set or clear the @shadow model (FR-02-08)
      x-required-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model_version]
              additionalProperties: false
              properties:
                model_version: { type: [string, "null"], maxLength: 100 }
      responses:
        "200":
          description: Shadow state
          content:
            application/json:
              schema:
                type: object
                required: [model_version, enabled_at]
                properties:
                  model_version: { type: [string, "null"] }
                  enabled_at: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  /admin/datasets:
    get:
      tags: [admin]
      operationId: listTrainingDatasets
      summary: Uploaded labelled datasets (FR-06-04)
      x-required-roles: [ADMIN]
      responses:
        "200":
          description: Datasets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TrainingDataset" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }
    post:
      tags: [admin]
      operationId: uploadTrainingDataset
      summary: Upload a labelled CSV; schema-validated and scanned for raw PII before acceptance
      x-required-roles: [ADMIN]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, name]
              properties:
                name: { type: string, minLength: 3, maxLength: 100 }
                file: { type: string, contentMediaType: text/csv }
      responses:
        "201":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingDataset" }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  /admin/retraining-jobs:
    post:
      tags: [admin]
      operationId: startRetraining
      summary: Start retraining on a dataset; starts within 60 seconds, progress streamed over WebSocket
      x-required-roles: [ADMIN]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dataset_id]
              additionalProperties: false
              properties:
                dataset_id: { type: string, format: uuid }
      responses:
        "202":
          description: Started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetrainingJob" }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  /admin/retraining-jobs/{job_id}:
    get:
      tags: [admin]
      operationId: getRetrainingJob
      summary: Retraining progress and evaluation outcome
      x-required-roles: [ADMIN]
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetrainingJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  /admin/health:
    get:
      tags: [admin]
      operationId: getSystemHealth
      summary: Consumer lag, scoring latency, error rate, Redis hit rate, pool usage, queue depths (FR-06-05)
      x-required-roles: [ADMIN]
      responses:
        "200":
          description: Health snapshot from Prometheus
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemHealth" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  /admin/audit-events:
    get:
      tags: [admin]
      operationId: searchAuditEvents
      summary: Search the append-only audit log (FR-06-06, D-32)
      x-required-roles: [ADMIN]
      parameters:
        - { name: user_id, in: query, schema: { type: string, format: uuid } }
        - { name: event_type, in: query, schema: { $ref: "#/components/schemas/AuditEventType" } }
        - { name: from, in: query, schema: { $ref: "#/components/schemas/Timestamp" } }
        - { name: to, in: query, schema: { $ref: "#/components/schemas/Timestamp" } }
        - { name: entity_type, in: query, schema: { type: string, maxLength: 64 } }
        - { name: entity_id, in: query, schema: { type: string, maxLength: 128 } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventPage" }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  /admin/circuit-breakers:
    get:
      tags: [admin]
      operationId: listCircuitBreakers
      summary: MCC circuit breaker states (FR-03-07, D-18)
      x-required-roles: [ADMIN]
      responses:
        "200":
          description: Breakers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CircuitBreaker" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  /admin/webhook-deliveries:
    get:
      tags: [admin]
      operationId: listFailedWebhookDeliveries
      summary: Webhook deliveries that exhausted retries (dead-letter queue, E.1)
      x-required-roles: [ADMIN]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Failed deliveries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookDeliveryPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  # ---------------------------------------------------------------------------------------------
  # Customer verification (server-rendered HTML, no JavaScript; D-25, D-42)
  # ---------------------------------------------------------------------------------------------
  /verify/{token}:
    servers:
      - url: /
        description: Served outside /api/v1 on the institution's own domain
    get:
      tags: [verification]
      operationId: showVerificationPage
      summary: Masked transaction details with "Yes, this was me" / "No, this was not me"
      description: |
        When self-service is disabled (recent or unknown SIM swap, device change in 24 h, score ≥ 0.95,
        account-takeover signals), the page tells the customer to contact the institution instead (D-25).
        Expired or used tokens show a non-revealing message. Page weight ≤ 30 KB.
      security: []
      x-public: true
      parameters:
        - $ref: "#/components/parameters/VerificationToken"
        - name: lang
          in: query
          schema: { $ref: "#/components/schemas/Locale" }
      responses:
        "200":
          description: Verification page
          content:
            text/html:
              schema: { type: string }
        "410":
          description: Expired or already used (same wording in both cases)
          content:
            text/html:
              schema: { type: string }
    post:
      tags: [verification]
      operationId: submitVerification
      summary: Record the customer's answer; "Yes" lifts the block within 10 seconds unless disabled
      security: []
      x-public: true
      parameters:
        - $ref: "#/components/parameters/VerificationToken"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [answer, csrf]
              properties:
                answer: { type: string, enum: [WAS_ME, NOT_ME] }
                csrf: { type: string, minLength: 32 }
      responses:
        "200":
          description: Result page
          content:
            text/html:
              schema: { type: string }
        "410":
          description: Expired or already used
          content:
            text/html:
              schema: { type: string }

components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: "`fsk_<env>_<keyId>_<secret>`; verified by HMAC with a server pepper (D-19)."
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "RS256 access token, 15-minute expiry; claims sub, role, first_name, email, institution_id, token_version, sid (session and refresh-token family ID, ADR 0014), kid."
    refreshCookie:
      type: apiKey
      in: cookie
      name: fs_refresh
      description: Rotating refresh token (httpOnly, Secure, SameSite=Strict, path /api/v1/auth/refresh)

  parameters:
    TransactionId:
      name: transaction_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    JobId:
      name: job_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AlertId:
      name: alert_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RuleId:
      name: rule_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReportId:
      name: report_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: user_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    KeyId:
      name: key_id
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z0-9]{12}$" }
    ModelVersionParam:
      name: model_version
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9._-]{1,100}$" }
    AccountToken:
      name: account_token
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Token" }
    VerificationToken:
      name: token
      in: path
      required: true
      description: At least 128 bits of randomness, base64url; stored only as a SHA-256 hash
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{22,128}$" }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 512 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique per logical action; replays return the original outcome (D-29)
      schema: { type: string, format: uuid }
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Double-submit token matching the CSRF cookie (D-27)
      schema: { type: string, minLength: 32, maxLength: 256 }

  responses:
    ValidationProblem:
      description: Missing, malformed or invalid fields
      x-problem-types: ["urn:fraudshield:problem:validation"]
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ValidationProblem" }
          examples:
            missingField:
              value:
                type: urn:fraudshield:problem:validation
                title: Request validation failed
                status: 400
                detail: 1 field is invalid
                correlation_id: 6f1c2d8e-5b0a-4c55-9f7a-2a1d3c4b5e6f
                errors:
                  - field: currency
                    code: required
                    message: currency is required
    Unauthorized:
      description: Missing, invalid, expired or revoked credentials
      x-problem-types: ["urn:fraudshield:problem:unauthorized"]
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Authenticated but not permitted (wrong role, wrong API-key scope, pending approval)
      x-problem-types: ["urn:fraudshield:problem:forbidden"]
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Not found in the caller's institution
      x-problem-types: ["urn:fraudshield:problem:not-found"]
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotAcceptable:
      description: Unsupported Accept header
      x-problem-types: ["urn:fraudshield:problem:not-acceptable"]
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: Conflicting state or duplicate resource
      x-problem-types: ["urn:fraudshield:problem:conflict"]
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PromotionGateFailed:
      description: Shadow gate not met; reasons listed (D-11)
      x-problem-types: ["urn:fraudshield:problem:promotion-gate-failed"]
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/PromotionGateProblem" }
    Gone:
      description: Token expired or already used
      x-problem-types: ["urn:fraudshield:problem:gone"]
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Locked:
      description: Account locked after repeated failures; unlock by email link, administrator or after 30 minutes
      x-problem-types: ["urn:fraudshield:problem:account-locked"]
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PayloadTooLarge:
      description: Body exceeds the size limit
      x-problem-types: ["urn:fraudshield:problem:payload-too-large"]
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnsupportedMediaType:
      description: Content-Type must be application/json
      x-problem-types: ["urn:fraudshield:problem:unsupported-media-type"]
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: Rate limited
      x-problem-types: ["urn:fraudshield:problem:rate-limited"]
      headers:
        Retry-After:
          description: Seconds to wait
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ServiceUnavailable:
      description: A dependency is unavailable and no safe fallback exists
      x-problem-types: ["urn:fraudshield:problem:service-unavailable"]
      headers:
        Retry-After:
          description: Seconds to wait
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    AuthorisationRuleViolation:
      description: >-
        The role may call this operation but an object-level rule in the operation's
        x-authorisation-rules forbids this call (ADR 0014)
      x-problem-types:
        - "urn:fraudshield:problem:forbidden"
        - "urn:fraudshield:problem:escalation-level-required"
        - "urn:fraudshield:problem:not-decision-author"
        - "urn:fraudshield:problem:own-decision-override"
        - "urn:fraudshield:problem:self-modification"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    StateConflict:
      description: The target changed or is in a state that does not allow this action
      x-problem-types:
        - "urn:fraudshield:problem:conflict"
        - "urn:fraudshield:problem:stale-alert"
        - "urn:fraudshield:problem:review-deadline-passed"
        - "urn:fraudshield:problem:decision-not-committed"
        - "urn:fraudshield:problem:undo-window-expired"
        - "urn:fraudshield:problem:last-active-admin"
      content:
        application/problem+json:
          schema:
            description: A stale-alert problem must carry the current alert (D-29)
            allOf:
              - $ref: "#/components/schemas/Problem"
              - if:
                  properties: { type: { const: "urn:fraudshield:problem:stale-alert" } }
                  required: [type]
                then:
                  $ref: "#/components/schemas/StaleAlertProblem"
    AccountNotActive:
      description: The account is pending approval or deactivated (D-23, D-24, FR-06-02)
      x-problem-types: ["urn:fraudshield:problem:account-not-active"]
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    IdempotencyConflict:
      description: >-
        The transaction_id was already submitted within 24 hours with a different request
        fingerprint; nothing was scored (FR-01-03)
      x-problem-types: ["urn:fraudshield:problem:idempotency-conflict"]
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnexpectedProblem:
      description: Unexpected error; the correlation ID identifies server logs
      x-problem-types: ["urn:fraudshield:problem:internal"]
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

