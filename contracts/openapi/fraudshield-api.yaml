  schemas:
    # --- primitives ------------------------------------------------------------------------------
    Token:
      type: string
      pattern: "^tok_[A-Za-z0-9]{24,64}$"
      description: Opaque token issued by the institution's tokenisation service; never raw PII
    DecimalAmount:
      type: string
      pattern: "^(0|[1-9][0-9]{0,13})(\\.[0-9]{1,4})?$"
      description: Non-negative decimal with at most 14 integer digits and 4 decimals (DECIMAL(18,4))
    PositiveAmount:
      allOf:
        - $ref: "#/components/schemas/DecimalAmount"
        - not:
            pattern: "^0(\\.0{1,4})?$"
      description: DecimalAmount greater than zero
    CurrencyCode:
      type: string
      enum: [RWF, KES, TZS, UGX, CDF, BIF, SSP, SOS, USD, EUR]
      description: ISO 4217 codes accepted (matches the Java CurrencyCode enum)
    Money:
      type: object
      required: [amount, currency]
      additionalProperties: false
      properties:
        amount: { $ref: "#/components/schemas/DecimalAmount" }
        currency: { $ref: "#/components/schemas/CurrencyCode" }
    CountryCode:
      type: string
      pattern: "^[A-Z]{2}$"
      description: ISO 3166-1 alpha-2
    Timestamp:
      type: string
      format: date-time
      pattern: "Z$"
      description: RFC 3339 in UTC
    Channel:
      type: string
      enum: [MOBILE_MONEY, CARD, AGENT_BANKING, USSD, ONLINE, BANK_TRANSFER]
    RiskTier:
      type: string
      enum: [HIGH, MEDIUM, LOW]
    AlertTier:
      type: string
      enum: [HIGH, MEDIUM, ANOMALY]
    Decision:
      type: string
      enum: [APPROVE, DECLINE, HOLD]
    FinalDecisionValue:
      type: string
      enum: [APPROVE, DECLINE, HOLD, TIMEOUT_RELEASE]
    Role:
      type: string
      enum: [ANALYST, SENIOR_ANALYST, RISK_OFFICER, ADMIN]
    UserStatus:
      type: string
      enum: [PENDING_APPROVAL, ACTIVE, LOCKED, DEACTIVATED]
    Locale:
      type: string
      enum: [en, rw, fr, sw]
    Email:
      type: string
      format: email
      maxLength: 254
    Password:
      type: string
      minLength: 8
      maxLength: 72
      x-max-utf8-bytes: 72
      x-validation: password
      description: |
        FR-07-07 policy, decided in ADR 0014: 8 to 72 code points **and** at most 72 UTF-8 bytes,
        because bcrypt uses only the first 72 bytes. No character of Unicode categories Cc, Cf, Cs or
        Co (controls, format characters such as U+200B and U+FEFF, surrogates, private use) or Z
        other than U+0020 SPACE. Unassigned code points are not rejected, because what is unassigned
        depends on each runtime's Unicode version. At least one ASCII upper-case letter, one ASCII lower-case letter, one
        ASCII digit, and one special character: any other permitted character except the space
        (punctuation, symbols, emoji, non-ASCII letters and digits). JSON Schema cannot express the
        byte limit or Unicode categories, so the pattern below is only a screen; the server and the
        front end apply the full rule, tested against contracts/validation/password-vectors.json.
      allOf:
        - pattern: "[A-Z]"
        - pattern: "[a-z]"
        - pattern: "[0-9]"
        - pattern: "[^A-Za-z0-9 ]"
    ReasonCode:
      type: string
      pattern: "^[A-Z][A-Z0-9_]{2,63}$"
      description: Stable machine-readable reason; localised text lives in the console, not the API
    AlertStatus:
      type: string
      enum: [PENDING, IN_REVIEW, CONFIRMED_FRAUD, MARKED_LEGITIMATE, AUTO_RELEASED, ESCALATED, OVERRIDDEN]
    AuditEventType:
      type: string
      description: The twelve audit event types (D-32)
      enum:
        [AUTH, USER_ADMIN, TRANSACTION_DECISION, AUTO_BLOCK, CUSTOMER_VERIFICATION, ANALYST_DECISION,
         SENIOR_OVERRIDE, THRESHOLD_CHANGE, RULE_CHANGE, MODEL_LIFECYCLE, API_KEY_LIFECYCLE,
         REGULATORY_REPORT]
    Probability:
      type: number
      minimum: 0
      maximum: 1

    # --- problems (RFC 9457) --------------------------------------------------------------------
    Problem:
      type: object
      required: [type, title, status, correlation_id]
      properties:
        type: { $ref: "#/components/schemas/ProblemType" }
        title: { type: string, maxLength: 200 }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string, maxLength: 2000 }
        instance: { type: string, maxLength: 500 }
        correlation_id: { type: string, format: uuid }
    ProblemType:
      type: string
      description: |
        The problem type catalogue (RFC 9457 `type`, ADR 0011 section 6). Clients switch on these
        values; adding one is backward compatible, renaming or removing one is breaking. Each
        response in components/responses lists the types it may carry in `x-problem-types`.
      enum:
        - urn:fraudshield:problem:validation
        - urn:fraudshield:problem:unauthorized
        - urn:fraudshield:problem:forbidden
        - urn:fraudshield:problem:account-not-active
        - urn:fraudshield:problem:self-modification
        - urn:fraudshield:problem:escalation-level-required
        - urn:fraudshield:problem:not-decision-author
        - urn:fraudshield:problem:own-decision-override
        - urn:fraudshield:problem:not-found
        - urn:fraudshield:problem:not-acceptable
        - urn:fraudshield:problem:conflict
        - urn:fraudshield:problem:stale-alert
        - urn:fraudshield:problem:review-deadline-passed
        - urn:fraudshield:problem:decision-not-committed
        - urn:fraudshield:problem:undo-window-expired
        - urn:fraudshield:problem:idempotency-conflict
        - urn:fraudshield:problem:last-active-admin
        - urn:fraudshield:problem:promotion-gate-failed
        - urn:fraudshield:problem:gone
        - urn:fraudshield:problem:payload-too-large
        - urn:fraudshield:problem:unsupported-media-type
        - urn:fraudshield:problem:account-locked
        - urn:fraudshield:problem:rate-limited
        - urn:fraudshield:problem:service-unavailable
        - urn:fraudshield:problem:internal
    ValidationErrorCode:
      type: string
      description: >-
        Field-level error codes (ADR 0011 section 6). `x-status-by-code` gives the HTTP status each
        code implies: 400 when the body is not a usable instance of the schema, 422 for a
        well-formed field with an unacceptable value. A response with codes of both classes is 400
        and lists all errors. `fraudshield_contracts.validation` maps JSON Schema errors to these
        codes; shared vectors: contracts/validation/request-validation-vectors.json.
      enum: [malformed_json, required, unknown_field, not_a_token, type_mismatch, invalid_format, unsupported_value, out_of_range, length_out_of_range, item_count_out_of_range, duplicate_items, timestamp_in_future, thresholds_not_ordered, duplicate_channel, invalid_cidr, webhook_url_not_allowed, password_policy, person_name, escalation_target_not_higher]
      x-status-by-code:
        malformed_json: 400
        required: 400
        unknown_field: 400
        not_a_token: 400
        type_mismatch: 422
        invalid_format: 422
        unsupported_value: 422
        out_of_range: 422
        length_out_of_range: 422
        item_count_out_of_range: 422
        duplicate_items: 422
        timestamp_in_future: 422
        thresholds_not_ordered: 422
        duplicate_channel: 422
        invalid_cidr: 422
        webhook_url_not_allowed: 422
        password_policy: 422
        person_name: 422
        escalation_target_not_higher: 422
    ValidationProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [errors]
          properties:
            type: { const: "urn:fraudshield:problem:validation" }
            status: { enum: [400, 422] }
            errors:
              type: array
              minItems: 1
              items:
                type: object
                required: [field, code, message]
                additionalProperties: false
                properties:
                  field: { type: string, maxLength: 200 }
                  code: { $ref: "#/components/schemas/ValidationErrorCode" }
                  message: { type: string, maxLength: 500 }
    IdempotencyConflictProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            type: { const: "urn:fraudshield:problem:idempotency-conflict" }
            status: { const: 409 }
    StaleAlertProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [current]
          properties:
            current: { $ref: "#/components/schemas/AlertSummary" }
    PromotionGateProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [gate]
          properties:
            gate: { $ref: "#/components/schemas/ShadowGate" }

    # --- ingestion ------------------------------------------------------------------------------
    TransactionIngestRequest:
      type: object
      description: FR-01-02 schema plus the additions in ADR 0011
      required:
        [transaction_id, account_id, counterparty_id, amount, currency, channel, merchant_category_code,
         latitude, longitude, transaction_timestamp]
      additionalProperties: false
      properties:
        transaction_id: { type: string, format: uuid }
        account_id: { $ref: "#/components/schemas/Token" }
        counterparty_id: { $ref: "#/components/schemas/Token" }
        amount: { $ref: "#/components/schemas/PositiveAmount" }
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        channel: { $ref: "#/components/schemas/Channel" }
        merchant_category_code: { type: string, pattern: "^[0-9]{4}$" }
        merchant_name: { type: string, maxLength: 100 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        device_fingerprint:
          oneOf:
            - $ref: "#/components/schemas/Token"
            - type: "null"
        agent_id: { $ref: "#/components/schemas/Token" }
        counterparty_country: { $ref: "#/components/schemas/CountryCode" }
        transaction_timestamp:
          $ref: "#/components/schemas/Timestamp"
          description: Not more than 5 minutes in the future (checked by the server clock)
      allOf:
        - if:
            properties: { channel: { const: AGENT_BANKING } }
            required: [channel]
          then:
            required: [agent_id]
    TransactionBatchRequest:
      type: object
      required: [transactions]
      additionalProperties: false
      properties:
        transactions:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: "#/components/schemas/TransactionIngestRequest" }
    DecisionResponse:
      type: object
      description: Minimal machine response (D-12); model internals stay on staff endpoints
      required:
        [transaction_id, decision, risk_tier, reason_codes, scoring_result_id, model_version,
         decision_latency_ms, review_deadline_at, ml_unavailable_fallback]
      additionalProperties: false
      properties:
        transaction_id: { type: string, format: uuid }
        decision: { $ref: "#/components/schemas/Decision" }
        risk_tier: { $ref: "#/components/schemas/RiskTier" }
        reason_codes:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/ReasonCode" }
        scoring_result_id: { type: string, format: uuid }
        model_version: { type: string, maxLength: 100 }
        decision_latency_ms: { type: integer, minimum: 0 }
        review_deadline_at:
          description: Set only for HOLD
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        ml_unavailable_fallback:
          type: boolean
          description: >-
            True when the ML scorer was unavailable and the rule-based fallback decided (NFR-REL-01).
            An addition to the D-12 field list, recorded in ADR 0011 section 9: integrators need it
            to route fallback decisions to their own review, and it reveals no model internals.
      allOf:
        - description: HOLD, and only HOLD, carries a review deadline (D-14)
          if:
            properties: { decision: { const: HOLD } }
            required: [decision]
          then:
            properties:
              review_deadline_at: { $ref: "#/components/schemas/Timestamp" }
          else:
            properties:
              review_deadline_at: { type: "null" }
        - description: HOLD is the MEDIUM outcome (E.6)
          if:
            properties: { decision: { const: HOLD } }
            required: [decision]
          then:
            properties:
              risk_tier: { const: MEDIUM }
        - description: APPROVE is only possible for LOW (E.6)
          if:
            properties: { decision: { const: APPROVE } }
            required: [decision]
          then:
            properties:
              risk_tier: { const: LOW }
        - description: >-
            HIGH is always declined. DECLINE with a lower tier is allowed by the schema; the server
            produces it only for a frozen account, with reason ACCOUNT_FROZEN (E.6 step 2, a
            server-enforced rule the M6 decision-engine tests cover).
          if:
            properties: { risk_tier: { const: HIGH } }
            required: [risk_tier]
          then:
            properties:
              decision: { const: DECLINE }
    FinalDecision:
      type: object
      description: |
        One decision state of a transaction (D-14). The same shape is returned by
        `GET /decisions/{transaction_id}` (latest state), published on `fs.decisions.final` and sent
        as the `decision.final` webhook body, so the three cannot drift (ADR 0011 section 9).

        A transaction's decision can change more than once, so receivers must order by
        `decision_sequence`, not by decision value: apply a state only if its `decision_sequence` is
        greater than the last one applied for that `transaction_id`; otherwise acknowledge and
        ignore it. `event_id` identifies one state and stays the same across delivery retries.

        Allowed transitions (anything else is a server defect):
        * sequence 1 (`decided_by: MODEL`): APPROVE, DECLINE or HOLD, as in the ingest response;
        * HOLD → APPROVE or DECLINE (`ANALYST`), TIMEOUT_RELEASE (`TIMEOUT_POLICY`,
          RELEASE_WITH_TIMEOUT_LABEL) or DECLINE (`TIMEOUT_POLICY`, DECLINE_AND_VERIFY);
        * DECLINE → APPROVE (`CUSTOMER_VERIFICATION` "Yes, this was me", or `SENIOR_OVERRIDE`);
        * APPROVE or TIMEOUT_RELEASE → DECLINE and DECLINE → APPROVE (`SENIOR_OVERRIDE`);
        * no state ever returns to HOLD.
      required:
        [event_id, transaction_id, decision_sequence, decision, final, decided_at, decided_by,
         reason_codes, review_deadline_at, supersedes_decision]
      additionalProperties: false
      properties:
        event_id:
          type: string
          format: uuid
          description: Identifies this state; the deduplication key for webhook and Kafka deliveries
        transaction_id: { type: string, format: uuid }
        decision_sequence:
          type: integer
          minimum: 1
          description: 1 for the ingest decision; increases by exactly 1 with each change
        decision: { $ref: "#/components/schemas/FinalDecisionValue" }
        final:
          type: boolean
          description: >-
            False only while HOLD awaits review. A final state can still be superseded by a later
            sequence (customer verification or senior override).
        decided_at:
          $ref: "#/components/schemas/Timestamp"
          description: When this state was decided (for HOLD, the ingest decision time)
        decided_by:
          type: string
          enum: [MODEL, ANALYST, TIMEOUT_POLICY, CUSTOMER_VERIFICATION, SENIOR_OVERRIDE]
        reason_codes:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/ReasonCode" }
        review_deadline_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        supersedes_decision:
          description: The decision of sequence n-1; null for sequence 1
          oneOf:
            - $ref: "#/components/schemas/FinalDecisionValue"
            - type: "null"
      allOf:
        - if:
            properties: { decision: { const: HOLD } }
            required: [decision]
          then:
            properties:
              final: { const: false }
              review_deadline_at: { $ref: "#/components/schemas/Timestamp" }
          else:
            properties:
              final: { const: true }
              review_deadline_at: { type: "null" }
        - if:
            properties: { decision_sequence: { const: 1 } }
            required: [decision_sequence]
          then:
            properties:
              decided_by: { const: MODEL }
              supersedes_decision: { type: "null" }
              decision: { enum: [APPROVE, DECLINE, HOLD] }
          else:
            properties:
              decided_by: { not: { const: MODEL } }
              supersedes_decision: { $ref: "#/components/schemas/FinalDecisionValue" }
              decision: { not: { const: HOLD } }
    JobAccepted:
      type: object
      required: [job_id, accepted, status_url]
      additionalProperties: false
      properties:
        job_id: { type: string, format: uuid }
        accepted: { type: integer, minimum: 1, maximum: 1000 }
        status_url: { type: string }
    JobStatus:
      type: object
      required: [job_id, state, total, processed, failed, results]
      additionalProperties: false
      properties:
        job_id: { type: string, format: uuid }
        state: { type: string, enum: [QUEUED, RUNNING, COMPLETED, FAILED] }
        total: { type: integer, minimum: 0 }
        processed: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        results:
          type: array
          items:
            type: object
            required: [transaction_id, outcome]
            additionalProperties: false
            properties:
              transaction_id: { type: string, format: uuid }
              outcome: { type: string, enum: [DECIDED, REJECTED] }
              decision: { $ref: "#/components/schemas/DecisionResponse" }
              problem:
                description: Why the item was rejected (validation, or an idempotency conflict)
                oneOf:
                  - $ref: "#/components/schemas/ValidationProblem"
                  - $ref: "#/components/schemas/IdempotencyConflictProblem"
        next_cursor: { type: [string, "null"] }
    ProbeStatus:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: string, enum: [UP, DOWN] }
    ComponentHealth:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: string, enum: [UP, DEGRADED, DOWN] }
        detail: { type: string, maxLength: 200 }

    # --- scoring and explanations ---------------------------------------------------------------
    ShapContribution:
      type: object
      required: [feature, value, shap, direction, template_key]
      additionalProperties: false
      properties:
        feature: { type: string, pattern: "^[a-z][a-z0-9_]{1,63}$" }
        value:
          description: Feature value; null when the feature is structurally missing (D-04)
          type: [number, string, "null"]
        shap: { type: number, description: Weighted contribution in log-odds margin space (D-05) }
        direction: { type: string, enum: [INCREASES_RISK, DECREASES_RISK] }
        template_key: { type: string, pattern: "^feature\\.[a-z0-9_]+\\.[a-z_]+$" }
    ScoringResult:
      type: object
      description: The nine FR-02-01 fields plus identifiers and fallback flag
      required:
        [scoring_result_id, transaction_id, ensemble_score, xgboost_score, lightgbm_score, anomaly_score,
         risk_tier, shap_top5, feature_vector, model_version, scoring_duration_ms, ml_unavailable_fallback]
      additionalProperties: false
      properties:
        scoring_result_id: { type: string, format: uuid }
        transaction_id: { type: string, format: uuid }
        ensemble_score: { $ref: "#/components/schemas/Probability" }
        xgboost_score: { $ref: "#/components/schemas/Probability" }
        lightgbm_score: { $ref: "#/components/schemas/Probability" }
        anomaly_score: { $ref: "#/components/schemas/Probability" }
        risk_tier: { $ref: "#/components/schemas/RiskTier" }
        shap_top5:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/ShapContribution" }
        feature_vector:
          type: object
          description: All 44 features by name; structurally missing features are null (D-04)
          minProperties: 44
          maxProperties: 44
          additionalProperties:
            type: [number, string, "null"]
        model_version: { type: string, maxLength: 100 }
        scoring_duration_ms: { type: integer, minimum: 0 }
        ml_unavailable_fallback: { type: boolean }
    Explanation:
      type: object
      required: [transaction_id, base_value, final_margin, calibrated_probability, contributions, summary_template_key]
      additionalProperties: false
      properties:
        transaction_id: { type: string, format: uuid }
        base_value: { type: number, description: Expected margin (log-odds) }
        final_margin: { type: number }
        calibrated_probability: { $ref: "#/components/schemas/Probability" }
        contributions:
          type: array
          minItems: 44
          maxItems: 44
          items: { $ref: "#/components/schemas/ShapContribution" }
        summary_template_key: { type: string }
        summary_parameters:
          type: object
          additionalProperties: { type: [number, string] }

    # --- alerts ---------------------------------------------------------------------------------
    AlertSummary:
      description: Card and feed row content (FR-04-03)
      $ref: "#/components/schemas/AlertSummaryBase"
      # Closed beside the $ref: additionalProperties sees only the names listed here, so a bad
      # value in the base reports one error instead of marking every field unexpected (NF-01).
      properties: { alert_id: true, version: true, transaction_id: true, tier: true, status: true, fraud_probability: true, expected_loss_rwf: true, amount: true, channel: true, masked_account_name: true, merchant: true, transaction_timestamp: true, top_reasons: true, review_deadline_at: true, escalated_from_alert_id: true }
      additionalProperties: false
    AlertSummaryBase:
      type: object
      description: >-
        Open base shared by AlertSummary and AlertDetail. Not used directly; the composing schemas
        close it with unevaluatedProperties (additionalProperties inside allOf makes the
        composition unsatisfiable).
      required:
        [alert_id, version, transaction_id, tier, status, fraud_probability, amount, channel,
         masked_account_name, merchant, transaction_timestamp, top_reasons, review_deadline_at]
      properties:
        alert_id: { type: string, format: uuid }
        version: { type: integer, minimum: 0 }
        transaction_id: { type: string, format: uuid }
        tier: { $ref: "#/components/schemas/AlertTier" }
        status: { $ref: "#/components/schemas/AlertStatus" }
        fraud_probability: { $ref: "#/components/schemas/Probability" }
        expected_loss_rwf: { $ref: "#/components/schemas/DecimalAmount" }
        amount: { $ref: "#/components/schemas/Money" }
        channel: { $ref: "#/components/schemas/Channel" }
        masked_account_name:
          type: string
          maxLength: 64
          description: Masked display value from the PII vault, e.g. "J*** M***"; never a full name
          pattern: "^[^@\\d]*$"
        merchant: { type: [string, "null"], maxLength: 100 }
        transaction_timestamp: { $ref: "#/components/schemas/Timestamp" }
        top_reasons:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/ShapContribution" }
        review_deadline_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        escalated_from_alert_id: { type: [string, "null"], format: uuid }
    AlertDetail:
      # Closed at the composing level with the names from every allOf member (NF-01).
      properties: { alert_id: true, version: true, transaction_id: true, tier: true, status: true, fraud_probability: true, expected_loss_rwf: true, amount: true, channel: true, masked_account_name: true, merchant: true, transaction_timestamp: true, top_reasons: true, review_deadline_at: true, escalated_from_alert_id: true, account_token: true, counterparty_token: true, summary_template_key: true, summary_parameters: true, anomaly_score: true, decisions: true }
      additionalProperties: false
      allOf:
        - $ref: "#/components/schemas/AlertSummaryBase"
        - type: object
          required: [account_token, counterparty_token, summary_template_key, anomaly_score, decisions]
          properties:
            account_token: { $ref: "#/components/schemas/Token" }
            counterparty_token: { $ref: "#/components/schemas/Token" }
            summary_template_key: { type: string }
            summary_parameters:
              type: object
              additionalProperties: { type: [number, string] }
            anomaly_score: { $ref: "#/components/schemas/Probability" }
            decisions:
              type: array
              items: { $ref: "#/components/schemas/DecisionRecord" }
    AlertPage:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AlertSummary" }
        next_cursor: { type: [string, "null"] }
    AlertDecisionRequest:
      type: object
      required: [decision, comment, alert_version]
      additionalProperties: false
      properties:
        decision: { type: string, enum: [CONFIRM_FRAUD, MARK_LEGITIMATE] }
        comment: { type: string, minLength: 10, maxLength: 2000 }
        alert_version: { type: integer, minimum: 0 }
    AlertDecisionAccepted:
      type: object
      required: [decision_id, state, undo_until]
      additionalProperties: false
      properties:
        decision_id: { type: string, format: uuid }
        state: { type: string, const: PENDING_COMMIT }
        undo_until: { $ref: "#/components/schemas/Timestamp" }
    EscalationRequest:
      type: object
      required: [target_role, reason, alert_version]
      additionalProperties: false
      properties:
        target_role: { type: string, enum: [SENIOR_ANALYST, RISK_OFFICER] }
        reason: { type: string, minLength: 10, maxLength: 2000 }
        alert_version: { type: integer, minimum: 0 }
    OverrideRequest:
      type: object
      required: [original_decision_id, new_decision, reason, alert_version]
      additionalProperties: false
      properties:
        original_decision_id: { type: string, format: uuid }
        new_decision: { type: string, enum: [CONFIRM_FRAUD, MARK_LEGITIMATE] }
        reason: { type: string, minLength: 20, maxLength: 2000 }
        alert_version: { type: integer, minimum: 0 }
    DecisionRecord:
      type: object
      required: [decision_id, decision, analyst, decided_at, state]
      additionalProperties: false
      properties:
        decision_id: { type: string, format: uuid }
        decision:
          type: string
          enum: [CONFIRM_FRAUD, MARK_LEGITIMATE, ESCALATE, AUTO_RELEASED, AUTO_BLOCKED, SENIOR_OVERRIDE]
        analyst: { $ref: "#/components/schemas/StaffReference" }
        comment: { type: [string, "null"], maxLength: 2000 }
        decided_at: { $ref: "#/components/schemas/Timestamp" }
        state: { type: string, enum: [PENDING_COMMIT, COMMITTED, UNDONE] }
        override_of_decision_id: { type: [string, "null"], format: uuid }
        false_positive_confirmed: { type: [boolean, "null"] }
    StaffReference:
      type: [object, "null"]
      required: [user_id, first_name, last_name, role]
      additionalProperties: false
      properties:
        user_id: { type: string, format: uuid }
        first_name: { $ref: "#/components/schemas/PersonName" }
        last_name: { $ref: "#/components/schemas/PersonName" }
        role: { $ref: "#/components/schemas/Role" }
    DashboardStats:
      type: object
      required:
        [high_open, medium_open, auto_blocked_today, reviewed_today, fraud_prevented_today,
         average_review_seconds, analysts_online]
      additionalProperties: false
      properties:
        high_open: { type: integer, minimum: 0 }
        medium_open: { type: integer, minimum: 0 }
        auto_blocked_today: { type: integer, minimum: 0 }
        reviewed_today: { type: integer, minimum: 0 }
        fraud_prevented_today: { $ref: "#/components/schemas/Money" }
        average_review_seconds: { type: number, minimum: 0 }
        analysts_online: { type: integer, minimum: 0 }
    AnalystPerformance:
      type: object
      required: [reviewed_today, average_review_seconds, backlog, accuracy_rate, verified_decisions]
      additionalProperties: false
      properties:
        reviewed_today: { type: integer, minimum: 0 }
        average_review_seconds: { type: number, minimum: 0 }
        backlog: { type: integer, minimum: 0 }
        accuracy_rate: { type: [number, "null"], minimum: 0, maximum: 1, description: Null until customer verifications exist }
        verified_decisions: { type: integer, minimum: 0 }

    # --- accounts -------------------------------------------------------------------------------
    AccountTransaction:
      type: object
      required: [transaction_id, amount, channel, transaction_timestamp, risk_score, risk_tier, outcome]
      additionalProperties: false
      properties:
        transaction_id: { type: string, format: uuid }
        amount: { $ref: "#/components/schemas/Money" }
        channel: { $ref: "#/components/schemas/Channel" }
        transaction_timestamp: { $ref: "#/components/schemas/Timestamp" }
        risk_score: { $ref: "#/components/schemas/Probability" }
        risk_tier: { $ref: "#/components/schemas/RiskTier" }
        outcome: { type: string, enum: [APPROVED, BLOCKED, PENDING] }
    AccountTransactionPage:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 30
          items: { $ref: "#/components/schemas/AccountTransaction" }
        next_cursor: { type: [string, "null"] }
    BehaviourProfile:
      type: object
      required: [hourly_counts, amount_histogram, channel_mix, comparison, window_days]
      additionalProperties: false
      properties:
        window_days: { type: integer, const: 90 }
        hourly_counts:
          type: array
          minItems: 24
          maxItems: 24
          items: { type: integer, minimum: 0 }
        amount_histogram:
          type: array
          items:
            type: object
            required: [lower_rwf, upper_rwf, count]
            additionalProperties: false
            properties:
              lower_rwf: { $ref: "#/components/schemas/DecimalAmount" }
              upper_rwf: { $ref: "#/components/schemas/DecimalAmount" }
              count: { type: integer, minimum: 0 }
        channel_mix:
          type: array
          items:
            type: object
            required: [channel, count]
            additionalProperties: false
            properties:
              channel: { $ref: "#/components/schemas/Channel" }
              count: { type: integer, minimum: 0 }
        comparison:
          type: array
          items:
            type: object
            required: [attribute, this_transaction, normal, anomalous]
            additionalProperties: false
            properties:
              attribute: { type: string, maxLength: 64 }
              this_transaction: { type: [string, number, "null"] }
              normal: { type: [string, number, "null"] }
              anomalous: { type: boolean }
    AccountNetwork:
      type: object
      required: [nodes, edges]
      additionalProperties: false
      properties:
        nodes:
          type: array
          maxItems: 50
          items:
            type: object
            required: [token, degree, confirmed_fraud]
            additionalProperties: false
            properties:
              token: { $ref: "#/components/schemas/Token" }
              degree: { type: integer, minimum: 0, maximum: 2 }
              confirmed_fraud: { type: boolean }
        edges:
          type: array
          items:
            type: object
            required: [source, target, transaction_count]
            additionalProperties: false
            properties:
              source: { $ref: "#/components/schemas/Token" }
              target: { $ref: "#/components/schemas/Token" }
              transaction_count: { type: integer, minimum: 1 }

    # --- risk officer ---------------------------------------------------------------------------
    PortfolioSummary:
      type: object
      required: [period, fraud_prevented, fraud_prevented_count, fraud_rate_by_channel, fraud_rate_by_mcc, top_counterparties]
      additionalProperties: false
      properties:
        period: { type: string, enum: [day, week, month] }
        fraud_prevented: { $ref: "#/components/schemas/Money" }
        fraud_prevented_count: { type: integer, minimum: 0 }
        fraud_rate_by_channel:
          type: array
          items:
            type: object
            required: [channel, rate, transactions]
            additionalProperties: false
            properties:
              channel: { $ref: "#/components/schemas/Channel" }
              rate: { $ref: "#/components/schemas/Probability" }
              transactions: { type: integer, minimum: 0 }
        fraud_rate_by_mcc:
          type: array
          items:
            type: object
            required: [merchant_category_code, rate, transactions]
            additionalProperties: false
            properties:
              merchant_category_code: { type: string, pattern: "^[0-9]{4}$" }
              rate: { $ref: "#/components/schemas/Probability" }
              transactions: { type: integer, minimum: 0 }
        top_counterparties:
          type: array
          maxItems: 10
          items:
            type: object
            required: [counterparty_token, confirmed_fraud_count, amount]
            additionalProperties: false
            properties:
              counterparty_token: { $ref: "#/components/schemas/Token" }
              confirmed_fraud_count: { type: integer, minimum: 0 }
              amount: { $ref: "#/components/schemas/Money" }
    Heatmap:
      type: object
      required: [period, k_anonymity_threshold, cells]
      additionalProperties: false
      properties:
        period: { type: string, enum: [day, week, month] }
        k_anonymity_threshold: { type: integer, const: 10 }
        cells:
          type: array
          items:
            type: object
            required: [country, district_code, fraud_events]
            additionalProperties: false
            properties:
              country: { $ref: "#/components/schemas/CountryCode" }
              district_code: { type: string, maxLength: 32 }
              fraud_events: { type: integer, minimum: 10 }
    ModelPerformance:
      type: object
      required: [model_version, window_hours, label_coverage, auc_roc, precision, recall, f1, false_positive_rate, drift_alert, baseline_auc_roc]
      additionalProperties: false
      properties:
        model_version: { type: string, maxLength: 100 }
        window_hours: { type: integer, minimum: 1 }
        label_coverage: { $ref: "#/components/schemas/Probability" }
        auc_roc: { type: [number, "null"], minimum: 0, maximum: 1 }
        baseline_auc_roc: { type: number, minimum: 0, maximum: 1 }
        precision: { type: [number, "null"], minimum: 0, maximum: 1 }
        recall: { type: [number, "null"], minimum: 0, maximum: 1 }
        f1: { type: [number, "null"], minimum: 0, maximum: 1 }
        false_positive_rate: { type: [number, "null"], minimum: 0, maximum: 1 }
        drift_alert: { type: boolean, description: True when AUC-ROC dropped more than 0.03 from baseline }
        top_feature_psi:
          type: array
          items:
            type: object
            required: [feature, psi]
            additionalProperties: false
            properties:
              feature: { type: string }
              psi: { type: number, minimum: 0 }
    Campaign:
      type: object
      required: [campaign_id, campaign_name, detected_at, shared_feature_type, shared_feature_value, transaction_count, total_amount, status, version]
      additionalProperties: false
      properties:
        campaign_id: { type: string, format: uuid }
        campaign_name: { type: string, pattern: "^CMP-[0-9]{8}-(DEVICE|COUNTERPARTY|GEOGRAPHIC|MCC)-[0-9]{4}$" }
        detected_at: { $ref: "#/components/schemas/Timestamp" }
        shared_feature_type: { type: string, enum: [DEVICE, COUNTERPARTY, GEOGRAPHIC, MCC] }
        shared_feature_value: { type: string, maxLength: 128 }
        transaction_count: { type: integer, minimum: 5 }
        total_amount: { $ref: "#/components/schemas/Money" }
        status: { type: string, enum: [ACTIVE, CLOSED] }
        version: { type: integer, minimum: 0 }
    CampaignPage:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Campaign" }
        next_cursor: { type: [string, "null"] }
    RuleExpression:
      description: Rule DSL AST (E.6); fields are raw request fields or the 44 registered features
      oneOf:
        - type: object
          required: [all]
          additionalProperties: false
          properties:
            all: { type: array, minItems: 1, items: { $ref: "#/components/schemas/RuleExpression" } }
        - type: object
          required: [any]
          additionalProperties: false
          properties:
            any: { type: array, minItems: 1, items: { $ref: "#/components/schemas/RuleExpression" } }
        - type: object
          required: [not]
          additionalProperties: false
          properties:
            not: { $ref: "#/components/schemas/RuleExpression" }
        - type: object
          required: [field, op]
          additionalProperties: false
          properties:
            field: { type: string, pattern: "^[a-z][a-z0-9_]{1,63}$" }
            op: { type: string, enum: [eq, ne, gt, gte, lt, lte, in, not_in, between, is_null, is_not_null] }
            value: { type: [string, number, boolean, array, "null"] }
    RuleDraft:
      $ref: "#/components/schemas/RuleDraftBase"
      # Closed beside the $ref: additionalProperties sees only the names listed here, so a bad
      # value in the base reports one error instead of marking every field unexpected (NF-01).
      properties: { rule_name: true, description: true, expression: true, risk_tier_override: true }
      additionalProperties: false
    RuleDraftBase:
      type: object
      description: Open base shared by RuleDraft and Rule (closed by the composing schemas)
      required: [rule_name, description, expression, risk_tier_override]
      properties:
        rule_name: { type: string, pattern: "^[A-Za-z0-9 _.-]{3,80}$" }
        description: { type: string, minLength: 10, maxLength: 1000 }
        expression: { $ref: "#/components/schemas/RuleExpression" }
        risk_tier_override: { type: string, enum: [HIGH, MEDIUM], description: Rules may only raise a tier }
    Rule:
      # Closed at the composing level with the names from every allOf member (NF-01).
      properties: { rule_name: true, description: true, expression: true, risk_tier_override: true, rule_id: true, version: true, state: true, created_by: true, created_at: true, trigger_count: true, last_triggered_at: true }
      additionalProperties: false
      allOf:
        - $ref: "#/components/schemas/RuleDraftBase"
        - type: object
          required: [rule_id, version, state, created_by, created_at, trigger_count, last_triggered_at]
          properties:
            rule_id: { type: string, format: uuid }
            version: { type: integer, minimum: 1 }
            state: { type: string, enum: [ENABLED, DISABLED, DELETED] }
            created_by: { $ref: "#/components/schemas/StaffReference" }
            created_at: { $ref: "#/components/schemas/Timestamp" }
            trigger_count: { type: integer, minimum: 0 }
            last_triggered_at:
              oneOf:
                - $ref: "#/components/schemas/Timestamp"
                - type: "null"
    ChannelThreshold:
      type: object
      required: [channel, medium_threshold, high_threshold]
      additionalProperties: false
      description: >-
        Half-open tiers — HIGH ≥ high; MEDIUM ≥ medium and < high; LOW otherwise (E.6). The server
        rejects medium_threshold ≥ high_threshold with 422 thresholds_not_ordered (JSON Schema
        cannot compare two fields).
      properties:
        channel: { $ref: "#/components/schemas/Channel" }
        medium_threshold: { $ref: "#/components/schemas/Probability" }
        high_threshold: { $ref: "#/components/schemas/Probability" }
        medium_timeout_policy: { type: string, enum: [RELEASE_WITH_TIMEOUT_LABEL, DECLINE_AND_VERIFY] }
    ThresholdSet:
      type: object
      required: [version, effective_at, channels]
      additionalProperties: false
      properties:
        version: { type: integer, minimum: 1 }
        effective_at: { $ref: "#/components/schemas/Timestamp" }
        channels:
          type: array
          minItems: 6
          maxItems: 6
          description: Exactly one entry per channel
          items: { $ref: "#/components/schemas/ChannelThreshold" }
    ThresholdUpdate:
      type: object
      required: [base_version, channels, reason]
      additionalProperties: false
      properties:
        base_version: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 10, maxLength: 500 }
        channels:
          type: array
          minItems: 1
          maxItems: 6
          description: At most one entry per channel (422 duplicate_channel)
          items: { $ref: "#/components/schemas/ChannelThreshold" }
    SarReport:
      type: object
      required: [report_id, version, template_version, status, transaction_ids, created_at, fields, watermark]
      additionalProperties: false
      properties:
        report_id: { type: string, format: uuid }
        version: { type: integer, minimum: 0 }
        template_version: { type: string, maxLength: 32 }
        status: { type: string, enum: [DRAFT, SIGNED_OFF] }
        transaction_ids:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        signed_off_by: { $ref: "#/components/schemas/StaffReference" }
        watermark: { type: string, const: "Draft — requires compliance review" }
        fields:
          type: array
          items:
            type: object
            required: [key, value, confirmation]
            additionalProperties: false
            properties:
              key: { type: string, maxLength: 64 }
              value: { type: [string, number, "null"] }
              confirmation: { type: string, enum: [CONFIRMED_FROM_PRIMARY_SOURCE, UNCONFIRMED_FIELD] }
    SarReportPage:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SarReport" }
        next_cursor: { type: [string, "null"] }

    # --- auth and staff -------------------------------------------------------------------------
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { $ref: "#/components/schemas/Email" }
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: >-
            1024 is only a transport cap. Input over 72 UTF-8 bytes cannot match any stored password
            (ADR 0014), so the server answers 401 invalid credentials without calling bcrypt and
            without revealing the policy.
    GoogleSignInRequest:
      type: object
      required: [authorization_code, code_verifier, redirect_uri]
      additionalProperties: false
      properties:
        authorization_code: { type: string, minLength: 10, maxLength: 2048 }
        code_verifier: { type: string, pattern: "^[A-Za-z0-9._~-]{43,128}$" }
        redirect_uri: { type: string, maxLength: 2048 }
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, user]
      additionalProperties: false
      properties:
        access_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, const: 900 }
        user: { $ref: "#/components/schemas/StaffUser" }
    PendingApproval:
      type: object
      required: [status, message_key]
      additionalProperties: false
      properties:
        status: { type: string, const: PENDING_APPROVAL }
        message_key: { type: string }
    SingleUseTokenRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token: { type: string, pattern: "^[A-Za-z0-9_-]{22,128}$" }
    PersonName:
      type: string
      minLength: 2
      maxLength: 100
      x-validation: person-name
      description: >-
        A first or last name as written, including multiple given names. The server normalises to
        NFC and enforces the person-name rule (ADR 0013): 2-100 Unicode code points; parts of Unicode
        letters and combining marks, each starting with a letter, separated by exactly one space,
        hyphen or apostrophe (ASCII or U+2019); no digits, symbols, emoji, control characters or
        surrounding whitespace. The rule is not a JSON Schema pattern because regex engines differ
        in Unicode support; shared vectors are in contracts/validation/person-name-vectors.json.
    PhoneE164:
      type: string
      pattern: "^\\+[1-9][0-9]{6,14}$"
    EmployeeId:
      type: string
      pattern: "^[A-Za-z0-9]{4,20}$"
    RegistrationRequest:
      type: object
      description: Department and requested role are separate; the granted role is set by an administrator (D-24)
      required: [first_name, last_name, email, phone, employee_id, department, requested_role, password, preferred_locale]
      additionalProperties: false
      properties:
        first_name: { $ref: "#/components/schemas/PersonName" }
        last_name: { $ref: "#/components/schemas/PersonName" }
        email: { $ref: "#/components/schemas/Email" }
        phone: { $ref: "#/components/schemas/PhoneE164" }
        employee_id: { $ref: "#/components/schemas/EmployeeId" }
        department: { type: string, enum: [FRAUD_OPERATIONS, RISK, COMPLIANCE, IT, OTHER] }
        requested_role: { $ref: "#/components/schemas/Role" }
        password: { $ref: "#/components/schemas/Password" }
        preferred_locale: { $ref: "#/components/schemas/Locale" }
    StaffUser:
      type: object
      required: [user_id, first_name, last_name, email, role, status, employee_id, department, preferred_locale, created_at]
      additionalProperties: false
      properties:
        user_id: { type: string, format: uuid }
        first_name: { $ref: "#/components/schemas/PersonName" }
        last_name: { $ref: "#/components/schemas/PersonName" }
        email: { $ref: "#/components/schemas/Email" }
        phone: { oneOf: [{ $ref: "#/components/schemas/PhoneE164" }, { type: "null" }] }
        avatar_url: { type: [string, "null"], maxLength: 2048 }
        role: { $ref: "#/components/schemas/Role" }
        requested_role: { oneOf: [{ $ref: "#/components/schemas/Role" }, { type: "null" }] }
        status: { $ref: "#/components/schemas/UserStatus" }
        employee_id: { $ref: "#/components/schemas/EmployeeId" }
        department: { type: string, enum: [FRAUD_OPERATIONS, RISK, COMPLIANCE, IT, OTHER] }
        preferred_locale: { $ref: "#/components/schemas/Locale" }
        email_verified: { type: boolean }
        linked_providers:
          type: array
          items: { type: string, enum: [GOOGLE] }
        last_login_at: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    StaffUserCreate:
      type: object
      required: [first_name, last_name, email, employee_id, department, role, preferred_locale]
      additionalProperties: false
      properties:
        first_name: { $ref: "#/components/schemas/PersonName" }
        last_name: { $ref: "#/components/schemas/PersonName" }
        email: { $ref: "#/components/schemas/Email" }
        phone: { $ref: "#/components/schemas/PhoneE164" }
        employee_id: { $ref: "#/components/schemas/EmployeeId" }
        department: { type: string, enum: [FRAUD_OPERATIONS, RISK, COMPLIANCE, IT, OTHER] }
        role: { $ref: "#/components/schemas/Role" }
        preferred_locale: { $ref: "#/components/schemas/Locale" }
    StaffUserUpdate:
      type: object
      minProperties: 2
      required: [version]
      additionalProperties: false
      properties:
        version: { type: integer, minimum: 0 }
        first_name: { $ref: "#/components/schemas/PersonName" }
        last_name: { $ref: "#/components/schemas/PersonName" }
        phone: { $ref: "#/components/schemas/PhoneE164" }
        department: { type: string, enum: [FRAUD_OPERATIONS, RISK, COMPLIANCE, IT, OTHER] }
        role: { $ref: "#/components/schemas/Role" }
        status: { type: string, enum: [ACTIVE, DEACTIVATED, LOCKED] }
        preferred_locale: { $ref: "#/components/schemas/Locale" }
    StaffUserPage:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/StaffUser" }
        next_cursor: { type: [string, "null"] }
    IpAllowlistEntryCreate:
      $ref: "#/components/schemas/IpAllowlistEntryBase"
      # Closed beside the $ref: additionalProperties sees only the names listed here, so a bad
      # value in the base reports one error instead of marking every field unexpected (NF-01).
      properties: { cidr: true, description: true }
      additionalProperties: false
    IpAllowlistEntryBase:
      type: object
      description: Open base shared by IpAllowlistEntryCreate and IpAllowlistEntry
      required: [cidr, description]
      properties:
        cidr:
          type: string
          pattern: "^[0-9a-fA-F:.]+/[0-9]{1,3}$"
          maxLength: 43
          description: >-
            IPv4 or IPv6 network in CIDR notation. The pattern only screens the shape; the server
            parses the address and prefix (IPv4 prefix ≤ 32, IPv6 ≤ 128, no host bits set) and
            rejects anything else with 422 invalid_cidr.
        description: { type: string, minLength: 3, maxLength: 200 }
    IpAllowlistEntry:
      # Closed at the composing level with the names from every allOf member (NF-01).
      properties: { cidr: true, description: true, entry_id: true, created_by: true, created_at: true }
      additionalProperties: false
      allOf:
        - $ref: "#/components/schemas/IpAllowlistEntryBase"
        - type: object
          required: [entry_id, created_by, created_at]
          properties:
            entry_id: { type: string, format: uuid }
            created_by: { $ref: "#/components/schemas/StaffReference" }
            created_at: { $ref: "#/components/schemas/Timestamp" }
    ApiKeyScope:
      type: string
      enum: ["ingest:write", "decisions:read", "jobs:read"]
    ApiKeyCreate:
      type: object
      required: [name, scopes]
      additionalProperties: false
      properties:
        name: { type: string, pattern: "^[A-Za-z0-9 _.-]{3,80}$" }
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/ApiKeyScope" }
        webhook_url:
          type: [string, "null"]
          format: uri
          pattern: "^https://"
          maxLength: 2048
          description: |
            Receives `decision.final`. Rejected with 422 `webhook_url_not_allowed` unless it is an
            absolute HTTPS URL without user info whose host resolves only to public addresses: no
            loopback, private (RFC 1918, RFC 4193), link-local (including 169.254.169.254 cloud
            metadata), carrier-grade NAT (100.64.0.0/10), multicast or unspecified addresses, and
            no IP literals. The dispatcher resolves the host again at every delivery, pins the
            connection to the checked address and does not follow redirects (SSRF, M6 test
            obligation).
    ApiKey:
      $ref: "#/components/schemas/ApiKeyBase"
      # Closed beside the $ref: additionalProperties sees only the names listed here, so a bad
      # value in the base reports one error instead of marking every field unexpected (NF-01).
      properties: { key_id: true, name: true, scopes: true, last_four: true, state: true, created_at: true, expires_at: true, last_used_at: true }
      additionalProperties: false
    ApiKeyBase:
      type: object
      description: Open base shared by ApiKey and ApiKeyCreated
      required: [key_id, name, scopes, last_four, state, created_at, expires_at, last_used_at]
      properties:
        key_id: { type: string, pattern: "^[a-z0-9]{12}$" }
        name: { type: string }
        scopes:
          type: array
          items: { $ref: "#/components/schemas/ApiKeyScope" }
        last_four: { type: string, pattern: "^[A-Za-z0-9]{4}$" }
        state: { type: string, enum: [ACTIVE, ROTATING, REVOKED] }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        expires_at:
          description: Set during the 24-hour rotation overlap
          oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }]
        last_used_at: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }
    ApiKeyCreated:
      # Closed at the composing level with the names from every allOf member (NF-01).
      properties: { key_id: true, name: true, scopes: true, last_four: true, state: true, created_at: true, expires_at: true, last_used_at: true, raw_key: true, webhook_signing_secret: true }
      additionalProperties: false
      allOf:
        - $ref: "#/components/schemas/ApiKeyBase"
        - type: object
          required: [raw_key]
          properties:
            raw_key:
              type: string
              pattern: "^fsk_(dev|test|stg|prod)_[a-z0-9]{12}_[A-Za-z0-9_-]{43}$"
              description: Shown exactly once; only an HMAC of the secret is stored (D-19)
            webhook_signing_secret:
              type: [string, "null"]
              pattern: "^whsec_(dev|test|stg|prod)_[A-Za-z0-9]{32,64}$"
              description: >-
                Shown exactly once; verifies decision.final webhooks. Null when the key has no
                webhook_url. The fixed prefix lets secret scanners recognise it.

    # --- models, datasets, health, audit ----------------------------------------------------------
    ShadowGate:
      type: object
      description: Promotion requirements (D-11)
      required: [shadow_hours, shadow_scored, auc_delta, label_coverage, psi, passed, reasons]
      additionalProperties: false
      properties:
        shadow_hours: { type: number, minimum: 0 }
        shadow_scored: { type: integer, minimum: 0 }
        auc_delta: { type: [number, "null"] }
        label_coverage: { $ref: "#/components/schemas/Probability" }
        psi: { type: [number, "null"], minimum: 0 }
        passed: { type: boolean }
        reasons:
          type: array
          items:
            type: string
            enum:
              [SHADOW_UNDER_24_HOURS, SHADOW_UNDER_50000_SCORED, AUC_DELTA_BELOW_MINUS_0_010,
               INSUFFICIENT_LABELS, PSI_AT_OR_ABOVE_0_2, EVALUATION_GATE_FAILED]
    ModelVersion:
      type: object
      required: [model_version, aliases, training_date, training_dataset_size, metrics, mlflow_run_id]
      additionalProperties: false
      properties:
        model_version: { type: string, maxLength: 100 }
        aliases:
          type: array
          items: { type: string, enum: [production, shadow, previous_production] }
        training_date: { $ref: "#/components/schemas/Timestamp" }
        training_dataset_size: { type: integer, minimum: 0 }
        metrics:
          type: object
          additionalProperties: false
          properties:
            auc_roc: { type: number }
            recall_at_1pct_fpr: { type: number }
            precision_at_1pct_fpr: { type: number }
            recall: { type: number }
            precision: { type: number }
            f1: { type: number }
            ece: { type: number }
        mlflow_run_id: { type: string, maxLength: 64 }
        shadow_gate: { oneOf: [{ $ref: "#/components/schemas/ShadowGate" }, { type: "null" }] }
    TrainingDataset:
      type: object
      required: [dataset_id, name, rows, uploaded_at, validation_state, sha256]
      additionalProperties: false
      properties:
        dataset_id: { type: string, format: uuid }
        name: { type: string }
        rows: { type: integer, minimum: 0 }
        uploaded_at: { $ref: "#/components/schemas/Timestamp" }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        validation_state: { type: string, enum: [VALIDATING, ACCEPTED, REJECTED] }
        rejection_reasons:
          type: array
          items: { type: string }
    RetrainingJob:
      type: object
      required: [job_id, dataset_id, state, progress_percent, started_at]
      additionalProperties: false
      properties:
        job_id: { type: string, format: uuid }
        dataset_id: { type: string, format: uuid }
        state: { type: string, enum: [QUEUED, TRAINING, EVALUATING, COMPLETED, FAILED] }
        progress_percent: { type: integer, minimum: 0, maximum: 100 }
        started_at: { $ref: "#/components/schemas/Timestamp" }
        candidate_model_version: { type: [string, "null"] }
        evaluation_passed: { type: [boolean, "null"] }
    SystemHealth:
      type: object
      required:
        [kafka_consumer_lag, scoring_latency_ms, api_error_rate, redis_hit_ratio, db_pool_in_use,
         auto_block_rate, alert_queue_depth, review_duration_seconds, degraded_modes]
      additionalProperties: false
      properties:
        kafka_consumer_lag:
          type: array
          items:
            type: object
            required: [topic, group, lag]
            additionalProperties: false
            properties:
              topic: { type: string }
              group: { type: string }
              lag: { type: integer, minimum: 0 }
        scoring_latency_ms:
          type: object
          required: [p50, p95, p99]
          additionalProperties: false
          properties:
            p50: { type: number, minimum: 0 }
            p95: { type: number, minimum: 0 }
            p99: { type: number, minimum: 0 }
        api_error_rate: { $ref: "#/components/schemas/Probability" }
        redis_hit_ratio: { $ref: "#/components/schemas/Probability" }
        db_pool_in_use: { $ref: "#/components/schemas/Probability" }
        auto_block_rate: { $ref: "#/components/schemas/Probability" }
        alert_queue_depth:
          type: object
          required: [HIGH, MEDIUM, ANOMALY]
          additionalProperties: false
          properties:
            HIGH: { type: integer, minimum: 0 }
            MEDIUM: { type: integer, minimum: 0 }
            ANOMALY: { type: integer, minimum: 0 }
        review_duration_seconds:
          type: object
          required: [p50, p90]
          additionalProperties: false
          properties:
            p50: { type: number, minimum: 0 }
            p90: { type: number, minimum: 0 }
        degraded_modes:
          type: array
          items: { type: string, enum: [ML_UNAVAILABLE, DEGRADED_MODE, KAFKA_SPOOLING, REALTIME_PAUSED] }
    AuditEvent:
      type: object
      required: [event_id, event_type, action, entity_type, entity_id, event_at, actor, row_hash]
      additionalProperties: false
      properties:
        event_id: { type: string, format: uuid }
        event_type: { $ref: "#/components/schemas/AuditEventType" }
        action: { type: string, pattern: "^[A-Z][A-Z_]{1,63}$" }
        entity_type: { type: string, maxLength: 64 }
        entity_id: { type: string, maxLength: 128 }
        event_at: { $ref: "#/components/schemas/Timestamp" }
        actor:
          description: Null for system events
          oneOf:
            - $ref: "#/components/schemas/StaffReference"
            - type: "null"
        before_value: { type: [object, "null"] }
        after_value: { type: [object, "null"] }
        ip_address: { type: [string, "null"], maxLength: 45 }
        row_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
    AuditEventPage:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEvent" }
        next_cursor: { type: [string, "null"] }
    CircuitBreaker:
      type: object
      required: [merchant_category_code, state, window_fraud_rate, window_transactions, opened_at]
      additionalProperties: false
      properties:
        merchant_category_code: { type: string, pattern: "^[0-9]{4}$" }
        state: { type: string, enum: [CLOSED, OPEN] }
        window_fraud_rate: { $ref: "#/components/schemas/Probability" }
        window_transactions: { type: integer, minimum: 0 }
        opened_at: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }
        clean_since: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }
    WebhookDelivery:
      type: object
      required: [delivery_id, event, transaction_id, attempts, last_status, last_attempt_at]
      additionalProperties: false
      properties:
        delivery_id: { type: string, format: uuid }
        event: { type: string, const: decision.final }
        transaction_id: { type: string, format: uuid }
        attempts: { type: integer, minimum: 1 }
        last_status: { type: [integer, "null"] }
        last_attempt_at: { $ref: "#/components/schemas/Timestamp" }
    WebhookDeliveryPage:
      type: object
      required: [items, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/WebhookDelivery" }
        next_cursor: { type: [string, "null"] }
