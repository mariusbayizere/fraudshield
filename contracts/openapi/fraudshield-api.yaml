                  keys:
                    type: array
                    items: { type: object }

  # ---------------------------------------------------------------------------------------------
  # Analyst console (FR-04)
  # ---------------------------------------------------------------------------------------------
  /dashboard/stats:
    get:
      tags: [alerts]
      operationId: getDashboardStats
      summary: The seven header statistics (SRS 5.4)
      x-required-roles: [ANALYST, SENIOR_ANALYST, RISK_OFFICER]
      responses:
        "200":
          description: Statistics for the caller's institution
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardStats" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  /alerts:
    get:
      tags: [alerts]
      operationId: listAlerts
      summary: Alert feed with composable filters (FR-04-02, FR-04-09)
      description: |
        Default order is HIGH first, then fraud probability descending (FR-04-02). `sort=expected_loss`
        orders by calibrated probability × amount in RWF (D-10). `queue=anomaly` lists
        Isolation-Forest-only alerts, which hold nothing and have no timer (D-10). `queue=escalated`
        lists only escalated entries whose target role is at or below the caller's role, plus
        entries the caller escalated.
      x-required-roles: [ANALYST, SENIOR_ANALYST, RISK_OFFICER]
      x-authorisation-rules:
        - rule: queue=escalated lists only entries whose target role is at or below the caller's role, plus entries the caller escalated
          effect: filter
      parameters:
        - { name: queue, in: query, schema: { type: string, enum: [standard, anomaly, escalated], default: standard } }
        - { name: transaction_id, in: query, schema: { type: string, format: uuid } }
        - { name: account_id, in: query, schema: { $ref: "#/components/schemas/Token" } }
        - { name: amount_min, in: query, schema: { $ref: "#/components/schemas/DecimalAmount" } }
        - { name: amount_max, in: query, schema: { $ref: "#/components/schemas/DecimalAmount" } }
        - name: channel
          in: query
          style: form
          explode: false
          schema: { type: array, items: { $ref: "#/components/schemas/Channel" }, uniqueItems: true }
        - { name: from, in: query, schema: { $ref: "#/components/schemas/Timestamp" } }
        - { name: to, in: query, schema: { $ref: "#/components/schemas/Timestamp" } }
        - name: tier
          in: query
          style: form
          explode: false
          schema: { type: array, items: { $ref: "#/components/schemas/AlertTier" }, uniqueItems: true }
        - { name: analyst_id, in: query, schema: { type: string, format: uuid } }
        - name: outcome
          in: query
          style: form
          explode: false
          schema: { type: array, items: { $ref: "#/components/schemas/AlertStatus" }, uniqueItems: true }
        - { name: sort, in: query, schema: { type: string, enum: [priority, expected_loss, newest], default: priority } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of alerts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertPage" }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  /alerts/{alert_id}:
    get:
      tags: [alerts]
      operationId: getAlert
      summary: Alert detail for the investigation drawer summary tab
      x-required-roles: [ANALYST, SENIOR_ANALYST, RISK_OFFICER]
      parameters:
        - $ref: "#/components/parameters/AlertId"
      responses:
        "200":
          description: Alert
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  /alerts/{alert_id}/explanation:
    get:
      tags: [alerts]
      operationId: getAlertExplanation
      summary: All 44 SHAP contributions in margin space with base value and templates (FR-04-05, D-05)
      x-required-roles: [ANALYST, SENIOR_ANALYST, RISK_OFFICER]
      parameters:
        - $ref: "#/components/parameters/AlertId"
      responses:
        "200":
          description: Explanation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Explanation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  /alerts/{alert_id}/decisions:
    post:
      tags: [alerts]
      operationId: decideAlert
      summary: CONFIRM FRAUD or MARK LEGITIMATE with a mandatory comment (FR-04-04)
      description: |
        Written immediately as `PENDING_COMMIT`; side effects are published after the 5-second undo
        window (D-44). A stale `alert_version` or a MEDIUM alert past its deadline returns 409 with
        the current state (D-29).
      x-required-roles: [ANALYST, SENIOR_ANALYST, RISK_OFFICER]
      x-authorisation-rules:
        - rule: Callers rank ANALYST < SENIOR_ANALYST < RISK_OFFICER (E.8). An escalated alert entry can be decided only by a caller whose role is at or above its target_role
          problem: urn:fraudshield:problem:escalation-level-required
          status: 403
        - rule: A stale alert_version returns the current alert
          problem: urn:fraudshield:problem:stale-alert
          status: 409
        - rule: A MEDIUM alert past review_deadline_at can no longer be decided here
          problem: urn:fraudshield:problem:review-deadline-passed
          status: 409
      parameters:
        - $ref: "#/components/parameters/AlertId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertDecisionRequest" }
      responses:
        "202":
          description: Decision recorded, pending commit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertDecisionAccepted" }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AuthorisationRuleViolation" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/StateConflict" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  /alerts/{alert_id}/decisions/{decision_id}/undo:
    post:
      tags: [alerts]
      operationId: undoAlertDecision
      summary: Undo a decision within its grace window (D-44)
      x-required-roles: [ANALYST, SENIOR_ANALYST, RISK_OFFICER]
      x-authorisation-rules:
        - rule: Only the author of the decision can undo it
          problem: urn:fraudshield:problem:not-decision-author
          status: 403
        - rule: Only a PENDING_COMMIT decision before undo_until can be undone
          problem: urn:fraudshield:problem:undo-window-expired
          status: 409
      parameters:
        - $ref: "#/components/parameters/AlertId"
        - name: decision_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Undone; a compensating record and an ANALYST_DECISION/UNDO audit event were written }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AuthorisationRuleViolation" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/StateConflict" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  /alerts/{alert_id}/escalations:
    post:
      tags: [alerts]
      operationId: escalateAlert
      summary: Escalate to a senior analyst or risk officer with a reason (FR-04-10)
      x-required-roles: [ANALYST, SENIOR_ANALYST]
      x-authorisation-rules:
        - rule: target_role must rank strictly above the caller's role (a SENIOR_ANALYST can escalate only to RISK_OFFICER)
          problem: urn:fraudshield:problem:validation
          code: escalation_target_not_higher
          status: 422
        - rule: Callers rank ANALYST < SENIOR_ANALYST < RISK_OFFICER (E.8). An escalated alert entry can be decided only by a caller whose role is at or above its target_role
          problem: urn:fraudshield:problem:escalation-level-required
          status: 403
        - rule: A stale alert_version returns the current alert
          problem: urn:fraudshield:problem:stale-alert
          status: 409
      parameters:
        - $ref: "#/components/parameters/AlertId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EscalationRequest" }
      responses:
        "201":
          description: New alert entry at the target tier, linked to the original
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertSummary" }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AuthorisationRuleViolation" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/StateConflict" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

  /alerts/{alert_id}/overrides:
    post:
      tags: [risk-officer]
      operationId: overrideAlertDecision
      summary: Senior override of an analyst decision with a reason of at least 20 characters (FR-05-01)
      x-required-roles: [RISK_OFFICER]
      x-authorisation-rules:
        - rule: Only a COMMITTED decision can be overridden; a PENDING_COMMIT one is still undoable by its author
          problem: urn:fraudshield:problem:decision-not-committed
          status: 409
        - rule: A risk officer cannot override a decision they made or an override they made
          problem: urn:fraudshield:problem:own-decision-override
          status: 403
        - rule: A stale alert_version returns the current alert
          problem: urn:fraudshield:problem:stale-alert
          status: 409
      parameters:
        - $ref: "#/components/parameters/AlertId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OverrideRequest" }
      responses:
        "201":
          description: SENIOR_OVERRIDE recorded, referencing the original decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DecisionRecord" }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AuthorisationRuleViolation" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/StateConflict" }
        "422": { $ref: "#/components/responses/ValidationProblem" }
        default: { $ref: "#/components/responses/UnexpectedProblem" }

