[project]
name = "fraudshield-contracts"
version = "0.1.0"
description = "Contract loading and validation for FraudShield's OpenAPI, protobuf, Kafka and webhook contracts"
requires-python = "==3.12.*"
license = "Apache-2.0"
dependencies = [
    "PyYAML==6.0.3",
    "jsonschema==4.26.0",
    "referencing==0.37.0",
    "openapi-spec-validator==0.9.0",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraudshield_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["req(*ids): links a test to requirement or defect IDs in docs/traceability/requirements.yaml"]
addopts = "-rs --strict-markers --import-mode=importlib --cov=fraudshield_contracts --cov-branch --cov-report=term-missing:skip-covered --cov-fail-under=90"
