# Install once with `make bootstrap` (runs `uv run pre-commit install`).
# Never bypass with --no-verify (build prompt G.6).
minimum_pre_commit_version: "4.0.0"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=5120"]
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
        exclude: ^docs/(srs|prompts)/
      - id: trailing-whitespace
        exclude: ^docs/(srs|prompts)/|\.md$

  - repo: local
    hooks:
      # Uses the gitleaks binary pinned in .tool-versions (8.30.1) rather than building from source.
      - id: gitleaks
        name: gitleaks (staged changes)
        entry: gitleaks git --pre-commit --staged --redact --no-banner --exit-code 1
        language: system
        pass_filenames: false
      - id: forbid-data-and-model-artifacts
        name: forbid datasets, model binaries and env files (G.5)
        entry: "committing datasets, model binaries or .env files is forbidden (G.5 / G.6)"
        language: fail
        files: (\.(csv|parquet|onnx|ubj|pkl|joblib)$|(^|/)\.env$|(^|/)mlruns/)
        exclude: ^docs/benchmarks/
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check --force-exclude
        language: system
        types: [python]
      - id: governance
        name: defect register, traceability, scope guard
        entry: make governance
        language: system
        pass_filenames: false
        always_run: true
