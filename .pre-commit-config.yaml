# Install once with `make bootstrap` (installs pre-commit and commit-msg hooks).
# Never bypass with --no-verify (build prompt G.6).
# CI runs these hooks too (job `pre-commit`), skipping those that CI runs as dedicated jobs.
minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=5120"]
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
        exclude: ^docs/(srs|prompts)/
      - id: trailing-whitespace
        exclude: ^docs/(srs|prompts)/|\.md$

  - repo: local
    hooks:
      # Pinned version with SHA-256 verification: tools/bin/gitleaks (never gitleaks from PATH).
      - id: gitleaks
        name: gitleaks (staged changes)
        entry: tools/bin/gitleaks git --pre-commit --staged --redact --no-banner --exit-code 1
        language: system
        pass_filenames: false
      - id: forbid-data-and-model-artifacts
        name: forbid datasets, model binaries, keys and env files (G.5)
        entry: "committing datasets, model binaries, keys or .env files is forbidden (G.5 / G.6)"
        language: fail
        files: (\.(csv|parquet|onnx|ubj|pkl|joblib|pem|key|p12|jks)$|(^|/)\.env$|(^|/)mlruns/)
        exclude: ^docs/benchmarks/
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check --force-exclude
        language: system
        types: [python]
      - id: prettier
        name: prettier (frontend)
        entry: bash -c 'cd frontend && pnpm exec prettier --check .'
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: spotless
        name: google-java-format (backend)
        entry: bash -c 'cd backend && ./mvnw -B -ntp -q spotless:check'
        language: system
        files: ^backend/.*\.java$
        pass_filenames: false
      - id: governance
        name: defect register, traceability seed and matrix, scope guard
        entry: make governance
        language: system
        pass_filenames: false
        always_run: true
      - id: commit-msg
        name: commit message follows G.3
        entry: uv run fs-commit-msg
        language: system
        stages: [commit-msg]
