# Staff email catalogue, English (D-43). {0} first name, {1} code, link or temporary password,
# {2} console base URL. Status: reviewed: false (author draft). Other languages fall back to this
# file until a translated catalogue with native-speaker review exists (mail_rw, mail_fr, mail_sw).
mail.account_locked.subject=FraudShield: your account is locked
mail.account_locked.body=Hello {0},\n\nYour FraudShield account was locked after 5 failed sign-in attempts. It unlocks automatically after 30 minutes.\n\nIf these attempts were yours, you can unlock it now: {1}\n\nIf they were not, do not use the link and contact your administrator.
mail.password_reset_code.subject=FraudShield: password reset code
mail.password_reset_code.body=Hello {0},\n\nYour password reset code is {1}. It expires in 10 minutes and can be used once.\n\nIf you did not ask to reset your password, ignore this email and tell your administrator.
mail.welcome.subject=FraudShield: your staff account
mail.welcome.body=Hello {0},\n\nAn administrator created your FraudShield account. Temporary password: {1}\n\nSign in at {2}/login and change it straight away. You can also sign in with Google from the same page if your institution uses Google accounts.
mail.registration_existing_account.subject=FraudShield: registration attempt
mail.registration_existing_account.body=Hello {0},\n\nSomeone tried to register a FraudShield account with your email address or employee ID. Your existing account has not changed.\n\nIf this was you, sign in at {2}/login or reset your password. If it was not, tell your administrator.
mail.email_verification.subject=FraudShield: confirm your email address
mail.email_verification.body=Hello {0},\n\nConfirm your email address to continue your FraudShield registration: {1}\n\nAn administrator must still approve your account before you can sign in.
