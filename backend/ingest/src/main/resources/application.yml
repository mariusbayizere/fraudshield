# FraudShield API. Connection values and secrets come from the environment; nothing secret is
# committed. The API connects to PostgreSQL as fs_app (ADR 0017).
spring:
  application:
    name: fraudshield-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${FRAUDSHIELD_DB_URL:jdbc:postgresql://127.0.0.1:5432/fraudshield_db}
    username: ${FRAUDSHIELD_DB_APP_USER:fs_app}
    password: ${FRAUDSHIELD_DB_APP_PASSWORD:}
    hikari:
      maximum-pool-size: ${FRAUDSHIELD_DB_POOL:20}
      connection-timeout: 2000
      # A PostgreSQL that stops answering must not hold a connection forever (C.4).
      data-source-properties:
        socketTimeout: 10
        connectTimeout: 2
  flyway:
    enabled: false
  # ADR 0068: Flyway owns the schema and no persistence context outlives its transaction.
  # PersistenceSettingsGuard refuses anything else at start-up.
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  # Staff identity (M7) reaches Redis through Spring Data; the same instance as fraudshield.redis-uri,
  # with timeouts of a few hundred milliseconds so a slow Redis degrades to the database fallbacks.
  data:
    redis:
      url: ${FRAUDSHIELD_REDIS_URI:redis://127.0.0.1:6379}
      timeout: 300ms
      connect-timeout: 300ms
  # Staff email (registration, unlock, password reset); Mailpit locally (D-51).
  mail:
    host: ${FRAUDSHIELD_SMTP_HOST:127.0.0.1}
    port: ${FRAUDSHIELD_SMTP_PORT:1025}

server:
  port: ${FRAUDSHIELD_API_PORT:8080}

management:
  server:
    port: ${FRAUDSHIELD_MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,prometheus

fraudshield:
  instance-id: ${HOSTNAME:fraudshield-api-local}
  redis-uri: ${FRAUDSHIELD_REDIS_URI:redis://127.0.0.1:6379}
  redis-timeout: 50ms
  kafka-bootstrap-servers: ${FRAUDSHIELD_KAFKA_BOOTSTRAP:127.0.0.1:9092}
  spool-directory: ${FRAUDSHIELD_SPOOL_DIR:/var/lib/fraudshield/spool}
  spool-max-bytes: 1073741824
  scorer:
    target: ${FRAUDSHIELD_SCORER_TARGET:127.0.0.1:9090}
    plaintext: ${FRAUDSHIELD_SCORER_PLAINTEXT:false}
    trust-certificate: ${FRAUDSHIELD_SCORER_CA:}
    client-certificate: ${FRAUDSHIELD_SCORER_CERT:}
    client-key: ${FRAUDSHIELD_SCORER_KEY:}
    deadline: 35ms
  review-window: 30s
  anomaly-review-threshold: 0.995
  audit-writer-partition: ${FRAUDSHIELD_AUDIT_PARTITION:0}
  default-locale: en
  idempotency-lease: 10s
  duplicate-wait: 1s
  batch-threads: 16
  # Staff identity and API keys (M7, backend/auth/README.md). Every secret is required: without one
  # the application refuses to start (H.1).
  auth:
    environment: ${FRAUDSHIELD_API_KEY_ENVIRONMENT:dev}
    console-base-url: ${FRAUDSHIELD_CONSOLE_BASE_URL:}
    mail-from: ${FRAUDSHIELD_MAIL_FROM:}
    token-key-hex: ${FRAUDSHIELD_TOKEN_KEY_HEX:}
    secret-box-key-id: ${FRAUDSHIELD_SECRET_BOX_KEY_ID:}
    secret-box-key-hex: ${FRAUDSHIELD_SECRET_BOX_KEY_HEX:}
    jwt:
      signing-keys:
        - kid: ${FRAUDSHIELD_JWT_KEY_ID:}
          private-key: ${FRAUDSHIELD_JWT_PRIVATE_KEY_FILE:}
    api-keys:
      peppers:
        1: ${FRAUDSHIELD_API_KEY_PEPPER_1:}
      current-pepper-version: 1
